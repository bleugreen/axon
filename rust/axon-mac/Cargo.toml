[package]
name = "axon-mac"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axon-core = { path = "../axon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"

[build-dependencies]
cc = "1"

[[bin]]
name = "axon-mac"
path = "src/main.rs"
