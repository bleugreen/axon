[workspace]
members = ["axon-core", "axon-win", "axon-linux", "axon-spike-win", "axon-spike-linux", "axon-mac", "axon-spike-mac", "uia-binding-eval"]
resolver = "2"

# The product version, kept in step with the repository-root VERSION file by
# scripts/check-version. Product crates inherit it with `version.workspace = true`.
[workspace.package]
version = "0.3.6"
edition = "2024"
publish = false
