[package]
name = "axon-linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axon-core = { path = "../axon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Proxies and the wire types only. `atspi-connection` is deliberately not compiled in: its
# `AccessibilityConnection` is inseparable from a peer-to-peer subsystem this backend never reads,
# and that subsystem cannot be switched off from here because the crate's own default features
# enable it. The backend opens its accessibility-bus connection itself, in `platform.rs`.
atspi = { version = "0.30.0", default-features = false, features = [
  "proxies",
  "tokio",
] }
tokio = { version = "1.47.1", features = ["rt", "time"] }
# Pure Rust, so no libxtst development package is needed to build this crate anywhere.
x11rb = { version = "0.14", features = ["xtest"] }

# The hermetic foreground test is its own miniature window manager, so it needs the protocol
# bindings directly rather than through the backend.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["xtest"] }

[[bin]]
name = "axon-linux"
path = "src/main.rs"
