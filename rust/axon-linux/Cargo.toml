[package]
name = "axon-linux"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axon-core = { path = "../axon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30.0", features = ["connection", "proxies", "tokio"] }
tokio = { version = "1.47.1", features = ["rt", "time"] }

[[bin]]
name = "axon-linux"
path = "src/main.rs"
