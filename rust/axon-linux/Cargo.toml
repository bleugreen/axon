[package]
name = "axon-linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axon-core = { path = "../axon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Proxies and the wire types only. `atspi-connection` is deliberately absent from this crate's
# dependencies: its `AccessibilityConnection` is inseparable from a peer-to-peer subsystem this
# backend never reads, and that subsystem cannot be switched off through a feature, because the
# crate's own defaults enable it whatever the facade asks for. The backend opens its
# accessibility-bus connection itself, in `platform.rs`.
#
# Scope: `-p axon-linux` compiles no peer code at all, which is what the release and live lanes
# build. A workspace-wide build still compiles it, because `axon-spike-linux` asks for the
# `connection` feature on purpose — that spike is the recorded comparison between the facade path
# and this one. Nothing in the product constructs an `AccessibilityConnection` either way.
atspi = { version = "0.30.0", default-features = false, features = [
  "proxies",
  "tokio",
] }
tokio = { version = "1.47.1", features = ["rt", "sync", "time"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.9.2"
# Pure Rust, so no libxtst development package is needed to build this crate anywhere.
x11rb = { version = "0.14", features = ["xtest"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Each hermetic test is its own miniature desktop, so both need the protocol layer directly rather
# than through the backend: `x11_foreground` an EWMH window manager, `atspi_activation` an AT-SPI
# provider. The zbus features match what `atspi` already resolves, so serving a bus adds nothing to
# what the backend itself is built against.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1.47.1", features = ["rt-multi-thread", "time"] }
x11rb = { version = "0.14", features = ["xtest"] }
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
tempfile = "3"

[[bin]]
name = "axon-linux"
path = "src/main.rs"
