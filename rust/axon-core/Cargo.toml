[package]
name = "axon-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

[dev-dependencies]
pretty_assertions = "1"