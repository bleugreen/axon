name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VERSION is the release source and the Swift and Rust literals are derived copies. Nothing
      # else notices when they drift, and the drift only becomes visible at release time.
      - name: Check version agreement
        run: ./scripts/check-version

  swift:
    name: Swift
    runs-on: [self-hosted, axon-live-mac]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.2-

      - name: Run Swift tests
        run: swift test

      # The macOS archive is the deployed product shape; a packaging break is otherwise only
      # discovered during a release, when it is most expensive.
      - name: Smoke-test the release package layout
        run: |
          set -euo pipefail
          ./scripts/package-app > /dev/null
          VERSION="$(./scripts/check-version)"
          ZIP="dist/Axon-$VERSION-macos-aarch64.zip"
          test -f "$ZIP"
          test -f "$ZIP.sha256"
          test -x "dist/Axon.app/Contents/Resources/bin/axon"
          test -x "dist/Axon.app/Contents/MacOS/Axon"
          unzip -l "$ZIP" | grep -q "Axon-$VERSION/Axon.app/"
          ACTUAL="$(dist/Axon.app/Contents/Resources/bin/axon version)"
          [[ "$ACTUAL" == "$VERSION" ]]

  rust-core:
    name: Rust core
    runs-on: [self-hosted, axon-live-linux]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
          shared-key: core

      - name: Run axon-core tests
        working-directory: rust
        run: cargo test -p axon-core

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

  rust-windows:
    name: Rust Windows
    runs-on: [self-hosted, axon-live-windows]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
          shared-key: windows

      # This runs the full axon-win suite headlessly. Router tests use a fake
      # backend and platform tests exercise pure helpers; no live UIA test is skipped.
      - name: Run headless axon-win tests
        working-directory: rust
        run: cargo test -p axon-win

      # Releases build in release mode, which type-checks the same code under different lint and
      # optimization settings. Finding a release-only break at tag time is too late.
      - name: Build axon-win in release mode
        working-directory: rust
        run: cargo build --release --locked -p axon-win

  rust-linux:
    name: Rust Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: linux

      - name: Install AT-SPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config xvfb x11-utils

      # The lifecycle, session classification, status assembly, keysym translation, and the whole
      # router are pure and run headlessly. Only the systemd and socket calls need a real desktop.
      - name: Run headless axon-linux tests
        working-directory: rust
        run: cargo test -p axon-linux

      # The one part of this backend a fake cannot exercise. Activation is a client message to a
      # window manager and proof is reading the answer back, so only a real X server can show that
      # the conversation works. The test brings its own miniature EWMH manager, which is why a bare
      # Xvfb is the entire requirement: no desktop, no toolkit, nothing to vary between runs.
      #
      # This runs for pull requests, unlike the live lane. It has to: the project's only real Linux
      # desktop is a GNOME Wayland session, which is the worst possible place to verify X11
      # activation and is asserted to refuse instead.
      - name: Run the hermetic X11 foreground test
        working-directory: rust
        env:
          DISPLAY: ":99"
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          xdpyinfo -display :99 >/dev/null
          cargo test -p axon-linux -- --ignored

      - name: Build axon-linux in release mode
        working-directory: rust
        run: cargo build --release --locked -p axon-linux

      - name: Smoke-test the Linux release package layout
        run: |
          set -euo pipefail
          ./scripts/package-rust axon-linux > /dev/null
          VERSION="$(./scripts/check-version)"
          ARCHIVE="dist/axon-linux-$VERSION-linux-x86_64.tar.gz"
          test -f "$ARCHIVE.sha256"
          tar -tzf "$ARCHIVE" | grep -q "axon-linux-$VERSION-linux-x86_64/axon-linux"
          tar -tzf "$ARCHIVE" | grep -q "systemd/axon.service.in"
          test -x "dist/axon-linux-$VERSION-linux-x86_64/axon-linux"
          ACTUAL="$(dist/axon-linux-$VERSION-linux-x86_64/axon-linux version)"
          [[ "$ACTUAL" == "$VERSION" ]]
