name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-installer:
    name: PowerShell installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('site/public/install.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }

  version:
    name: Version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VERSION is the release source and the Swift and Rust literals are derived copies. Nothing
      # else notices when they drift, and the drift only becomes visible at release time.
      - name: Check version agreement
        run: ./scripts/check-version

  sdk-typescript:
    name: TypeScript SDK
    # Hosted: the SDK never touches a desktop. Its tests answer a fake daemon over a Unix socket,
    # so nothing here needs accessibility, a session, or a real Axon build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # sdk/ts/src/generated.ts is derived from schema/tool-surface-v1.json the way that artifact
      # is derived from ToolSurfaceSpec.swift. Without this step a schema change lands a client
      # that silently describes the previous tool surface.
      - name: Check generated client agreement
        run: ./scripts/check-sdk-ts

      - name: Install the SDK development toolchain
        working-directory: sdk/ts
        run: bun install --frozen-lockfile

      - name: Typecheck the TypeScript SDK
        working-directory: sdk/ts
        run: bun run typecheck

      - name: Run TypeScript SDK tests
        working-directory: sdk/ts
        run: bun test

      # The package is published for Node as well as Bun, so the emitted JavaScript has to build.
      - name: Build the TypeScript SDK
        working-directory: sdk/ts
        run: bun run build

  sdk-python:
    name: Python SDK
    # Hosted, for the same reason the TypeScript SDK is: its tests answer a fake daemon over a
    # Unix socket, so nothing here needs accessibility, a session, or a real Axon build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generator is TypeScript whatever it emits, so this runner needs Bun as well as Python.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # The oldest interpreter the package claims, so a 3.12-only construct cannot pass unnoticed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check generated client agreement
        run: ./scripts/check-sdk-python

      - name: Install the SDK development toolchain
        run: python -m pip install --upgrade pip pytest pyright build

      # Also where tests/typing_cases.py is checked: pyright asserting that the generated types
      # still reject a call the daemon would reject.
      - name: Typecheck the Python SDK
        working-directory: sdk/python
        run: pyright

      - name: Run Python SDK tests
        working-directory: sdk/python
        run: pytest

      - name: Build the Python SDK
        working-directory: sdk/python
        run: python -m build

  swift:
    name: Swift
    runs-on: [self-hosted, axon-live-mac]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The live workflow has no `pull_request` trigger, so its steps first execute on a real
      # desktop with nothing having rehearsed them -- and the branches that decide whether that
      # desktop keeps its start-at-login daemon only run when a probe has already failed. This
      # drives those branches against stubbed system commands, from the workflow file itself.
      # First in the job, and before Swift, because it needs neither and a workflow-logic
      # regression should not wait behind a compiler.
      #
      # It runs here rather than on a hosted runner on purpose: `bash` resolves to 3.2 on this
      # machine, which is what the live lane will actually be interpreted by.
      - name: Rehearse the macOS live lane's recovery branches
        run: ./scripts/test-macos-live-recovery

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          # The dependency-only namespace must not match the immutable legacy archives that also
          # contain .build.
          key: ${{ runner.os }}-swiftpm-dependencies-6.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-dependencies-6.2-

      # This runner retains its workspace between branches. Swift's incremental records in .build
      # have skipped compiling changed test sources before, so no verdict may inherit them. Global
      # SwiftPM state above still avoids downloading dependencies again; compilation starts clean.
      - name: Remove prior Swift build state
        run: rm -rf .build

      - name: Run Swift tests
        run: swift test

      - name: Set up Rust for the macOS FFI spike
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      # Linux CI cannot compile the cfg-gated ApplicationServices declarations. Keep the unsafe
      # boundary visible to pull-request checks on the same macOS runner that validates Swift.
      - name: Lint the macOS AX spike
        working-directory: rust
        run: cargo clippy -p axon-spike-mac --all-targets -- -D warnings

      # The self-hosted runner's login keychain unlock is scoped to a macOS security session. A
      # previous job unlocking it does not make the signing identity available to this job.
      - name: Unlock signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.BGLAB_MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo '::error::BGLAB_MAC_KEYCHAIN_PASSWORD secret is not set'; exit 1
          fi
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db

      # The macOS archive is the deployed product shape; a packaging break is otherwise only
      # discovered during a release, when it is most expensive.
      - name: Smoke-test the release package layout
        run: |
          set -euo pipefail
          ./scripts/package-app > /dev/null
          VERSION="$(./scripts/check-version)"
          ZIP="dist/Axon-$VERSION-macos-aarch64.zip"
          test -f "$ZIP"
          test -f "$ZIP.sha256"
          test -x "dist/Axon.app/Contents/Resources/bin/axon"
          test -x "dist/Axon.app/Contents/MacOS/Axon"
          # Listed once into a variable for the same reason as the Linux archive check below:
          # `grep -q` short-circuits, and under `pipefail` that fails the pipeline on EPIPE.
          LISTING="$(unzip -l "$ZIP")"
          # The archive root is the application itself, so extracting it yields one Axon.app to
          # drag into /Applications. Assert the absence of the superseded version-named directory
          # too: a layout regression that reintroduced it would otherwise still satisfy a check
          # that only looks for what should be there.
          grep -q " Axon.app/" <<<"$LISTING"
          ! grep -q "Axon-$VERSION/" <<<"$LISTING"
          NESTED_EDITOR="Contents/Library/Applications/Axon Editor.app"
          test -x "dist/Axon.app/$NESTED_EDITOR/Contents/MacOS/AxonEditor"
          ACTUAL="$(dist/Axon.app/Contents/Resources/bin/axon version)"
          [[ "$ACTUAL" == "$VERSION" ]]
          assert_daemon_plist() {
            local plist="$1"
            [[ "$(plutil -extract CFBundleIdentifier raw "$plist")" == "com.bleugreen.axon" ]]
            [[ "$(plutil -extract CFBundleExecutable raw "$plist")" == "Axon" ]]
            [[ "$(plutil -extract CFBundleShortVersionString raw "$plist")" == "$VERSION" ]]
            [[ "$(plutil -extract CFBundleVersion raw "$plist")" == "$VERSION" ]]
            [[ "$(plutil -extract NSAppleEventsUsageDescription raw "$plist")" == "Axon uses browser automation to navigate and enumerate browser windows and tabs." ]]
          }
          # Version skew between the recorder and the editor is the failure nesting exists to make
          # impossible, so the packaged pair is asserted rather than assumed.
          assert_editor_plist() {
            local plist="$1"
            [[ "$(plutil -extract CFBundleIdentifier raw "$plist")" == "com.bleugreen.axon.editor" ]]
            [[ "$(plutil -extract CFBundleExecutable raw "$plist")" == "AxonEditor" ]]
            [[ "$(plutil -extract CFBundleShortVersionString raw "$plist")" == "$VERSION" ]]
            [[ "$(plutil -extract CFBundleVersion raw "$plist")" == "$VERSION" ]]
          }
          assert_daemon_plist "dist/Axon.app/Contents/Info.plist"
          assert_editor_plist "dist/Axon.app/$NESTED_EDITOR/Contents/Info.plist"
          # The other half of Apple Events consent, asserted beside the usage description it pairs
          # with: the string above supplies the dialog's wording, and the entitlement is what lets
          # the hardened runtime present a dialog at all. A build missing it passes every other
          # check here and ships a dead browser automation surface.
          ./scripts/check-app-entitlements "dist/Axon.app"
          archive_dir="$(mktemp -d)"
          trap 'rm -rf "$archive_dir"' EXIT
          ditto -x -k "$ZIP" "$archive_dir"
          assert_daemon_plist "$archive_dir/Axon.app/Contents/Info.plist"
          assert_editor_plist "$archive_dir/Axon.app/$NESTED_EDITOR/Contents/Info.plist"
          test -x "$archive_dir/Axon.app/Contents/Resources/bin/axon"
          test -x "$archive_dir/Axon.app/$NESTED_EDITOR/Contents/MacOS/AxonEditor"

  rust-macos:
    name: Rust macOS
    runs-on: macos-14
    steps:
      - name: Check out Axon
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run axon-mac tests
        working-directory: rust
        run: cargo test -p axon-mac
      - name: Lint axon-mac
        working-directory: rust
        run: cargo clippy -p axon-mac --all-targets -- -D warnings

  rust-core:
    name: Rust core
    # Hosted on purpose. axon-core is platform-neutral and pure -- no dbus, no X11, no desktop --
    # so it needs a machine rather than any particular machine. The enrolled Linux box is the only
    # one with a real GNOME session, and every job parked on it queues behind the live lane that
    # genuinely needs it. Self-host what needs that hardware; run the rest where a runner is free.
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt

      # Workspace Clippy compiles the Linux backend too, so this otherwise platform-neutral job
      # needs the same native build boundary as the dedicated Linux job.
      - name: Install Linux workspace build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libpipewire-0.3-dev libclang-dev clang pkg-config
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include -I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
          shared-key: core

      - name: Run axon-core tests
        working-directory: rust
        run: cargo test -p axon-core

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust Windows
    runs-on: [self-hosted, axon-live-windows]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The live workflow has no `pull_request` trigger, so its stages first execute on a real
      # desktop with nothing having rehearsed them -- and the branches that decide whether that
      # desktop keeps its start-at-login daemon only run when a probe has already failed. This
      # drives those branches against a stubbed machine, from the stage bodies themselves. First in
      # the job, and before Rust, because it needs neither and a lane regression should not wait
      # behind a compiler.
      - name: Rehearse the Windows live lane's recovery branches
        shell: pwsh
        run: pwsh -NoProfile -File scripts\test-windows-live-recovery.ps1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
          shared-key: windows

      # This runs the full axon-win suite headlessly. Router tests use a fake
      # backend and platform tests exercise pure helpers; no live UIA test is skipped.
      - name: Run headless axon-win tests
        working-directory: rust
        run: cargo test -p axon-win

      # Clippy has to run here and not only in the macOS job, because that job cannot see this
      # code at all: everything behind `#[cfg(windows)]` -- the whole UIA backend, the pipe
      # transport, the global input observer -- is invisible to a lint pass on another target. A
      # gate that cannot see the Windows-only code is not a gate for it, and it showed: five clippy
      # errors were sitting on `main` when axn/225 first ran this by hand.
      #
      # `cargo fmt` is not repeated for the same reason it is not needed: rustfmt formats every
      # file in the workspace regardless of target, so the macOS job's `--all --check` already
      # covers these sources.
      - name: Lint axon-win
        working-directory: rust
        run: cargo clippy -p axon-win --all-targets -- -D warnings

      # Releases build in release mode, which type-checks the same code under different lint and
      # optimization settings. Finding a release-only break at tag time is too late.
      - name: Build axon-win in release mode
        working-directory: rust
        run: cargo build --release --locked -p axon-win

  rust-linux:
    name: Rust Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: linux

      - name: Install AT-SPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libpipewire-0.3-dev libclang-dev clang pkg-config xvfb x11-utils dbus tesseract-ocr tesseract-ocr-eng
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include -I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      # The lifecycle, session classification, status assembly, keysym translation, and the whole
      # router are pure and run headlessly. Only the systemd and socket calls need a real desktop.
      - name: Run headless axon-linux tests
        working-directory: rust
        run: cargo test -p axon-linux

      # The parts of this backend a fake cannot exercise, because each one is a conversation rather
      # than a decision. X11 foreground activation is a client message to a window manager and proof
      # is reading the answer back, so it needs a real X server. Chromium-family activation is an
      # attributes call that crosses D-Bus and is answered late, so it needs a real bus. Each test
      # brings its own miniature server -- an EWMH window manager, an AT-SPI provider built to
      # withhold like Chromium -- so a bare Xvfb and dbus-daemon are the entire requirement for
      # those paths. OCR additionally renders a fixed X11 label and crosses production Tesseract
      # plus foreground click. `--ignored` sweeps every hermetic desktop test together.
      #
      # This runs for pull requests, unlike the live lane. It has to: the project's only real Linux
      # desktop is a GNOME Wayland session, which is the worst possible place to verify X11
      # activation and is asserted to refuse instead.
      - name: Run the hermetic desktop tests
        working-directory: rust
        env:
          DISPLAY: ":99"
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          xdpyinfo -display :99 >/dev/null
          cargo test -p axon-linux -- --ignored --test-threads=1

      - name: Build axon-linux in release mode
        working-directory: rust
        run: cargo build --release --locked -p axon-linux

      - name: Smoke-test the Linux release package layout
        run: |
          set -euo pipefail
          ./scripts/package-rust axon-linux > /dev/null
          VERSION="$(./scripts/check-version)"
          ARCHIVE="dist/axon-linux-$VERSION-linux-x86_64.tar.gz"
          test -f "$ARCHIVE.sha256"
          # Listed once into a variable rather than piped into `grep -q`: under `pipefail` a
          # short-circuiting reader closes the pipe, and the producer then fails the whole
          # pipeline on EPIPE even though the match succeeded.
          LISTING="$(tar -tzf "$ARCHIVE")"
          grep -q "axon-linux-$VERSION-linux-x86_64/axon-linux" <<<"$LISTING"
          grep -q "systemd/axon.service.in" <<<"$LISTING"
          test -x "dist/axon-linux-$VERSION-linux-x86_64/axon-linux"
          ACTUAL="$(dist/axon-linux-$VERSION-linux-x86_64/axon-linux version)"
          [[ "$ACTUAL" == "$VERSION" ]]

      # The Windows release job stages, signs, and archives as three separate steps, so the archive
      # it publishes is only correct if the archiving phase reads the staging directory as it stands
      # at that moment. The phases are platform-independent, and this is the one host in CI where
      # package-rust runs outside a release, so the contract is checked here.
      - name: Smoke-test the split staging and archiving phases
        run: |
          set -euo pipefail
          VERSION="$(./scripts/check-version)"
          NAME="axon-linux-$VERSION-linux-x86_64"
          rm -rf "dist/$NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256"

          # Archiving must not invent a release out of a staging directory nobody built.
          if ./scripts/package-rust axon-linux --archive-only > /dev/null 2>&1; then
            echo "::error::--archive-only produced an archive with nothing staged"
            exit 1
          fi

          ./scripts/package-rust axon-linux --stage-only > /dev/null
          test -x "dist/$NAME/axon-linux"
          test ! -e "dist/$NAME.tar.gz"

          # A staging directory left behind by a different revision carries the same version in its
          # name, so only the recorded provenance distinguishes it from this build's.
          STAMP="dist/.$NAME.stage"
          KEPT="$(cat "$STAMP")"
          echo "axon-linux $VERSION 0000000000000000000000000000000000000000" > "$STAMP"
          if ./scripts/package-rust axon-linux --archive-only > /dev/null 2>&1; then
            echo "::error::--archive-only archived a staging directory built from another revision"
            exit 1
          fi
          echo "$KEPT" > "$STAMP"

          # Stand in for the signing step, which rewrites the staged binary between the phases.
          printf 'signature' >> "dist/$NAME/axon-linux"
          ./scripts/package-rust axon-linux --archive-only > /dev/null
          cd dist
          sha256sum -c "$NAME.tar.gz.sha256"
          tar -xzf "$NAME.tar.gz" -O "$NAME/axon-linux" | cmp - "$NAME/axon-linux"
