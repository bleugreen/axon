name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift
    runs-on: [self-hosted, axon-live-mac]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.2-

      - name: Run Swift tests
        run: swift test

  rust-core:
    name: Rust core
    runs-on: [self-hosted, axon-live-linux]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
          shared-key: core

      - name: Run axon-core tests
        working-directory: rust
        run: cargo test -p axon-core

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

  rust-windows:
    name: Rust Windows
    runs-on: [self-hosted, axon-live-windows]
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
          shared-key: windows

      # This runs the full axon-win suite headlessly. Router tests use a fake
      # backend and platform tests exercise pure helpers; no live UIA test is skipped.
      - name: Run headless axon-win tests
        working-directory: rust
        run: cargo test -p axon-win
