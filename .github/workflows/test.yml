name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift
    runs-on: macos-15
    steps:
      - name: Check out Axon
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swift-6.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.2-

      - name: Run Swift tests
        run: swift test

  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: core

      - name: Run axon-core tests
        working-directory: rust
        run: cargo test -p axon-core

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

  rust-windows:
    name: Rust Windows
    runs-on: windows-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: windows

      # This runs the full axon-win suite headlessly. Router tests use a fake
      # backend and platform tests exercise pure helpers; no live UIA test is skipped.
      - name: Run headless axon-win tests
        working-directory: rust
        run: cargo test -p axon-win
