name: Deploy axn.dev

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "VERSION"
      - ".github/workflows/site.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-axn-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check Cloudflare credentials
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not set. Add it as a GitHub Actions repository secret.'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it as a GitHub Actions repository secret.'
            exit 1
          fi

      - name: Install site dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        run: npx wrangler pages deploy dist --project-name=axn-dev