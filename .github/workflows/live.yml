name: Live desktop verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS live loop
    runs-on: [self-hosted, axon-live-mac]
    concurrency:
      group: axon-live-mac
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      # The two labels `LaunchAgentConfiguration` registers an installed Axon by, in
      # `Sources/AxonClient/LaunchAgentManager.swift`: the Rust daemon (the bundle's main
      # executable) and the menu-bar shell. Named here because the parking and restore steps ask
      # launchd directly whether each is loaded, which is the one fact they need and no Axon
      # subcommand reports for a job that is booted out.
      AXON_LAUNCH_AGENT_LABEL: dev.axon.daemon
      AXON_MENU_AGENT_LABEL: dev.axon.menu
      # The candidate's own jobs. Private labels, so nothing this job bootstraps can be mistaken
      # for, or collide with, the desktop's registration, and so a leftover from a killed run is
      # addressable by name.
      AXON_LIVE_DAEMON_LABEL: dev.axon.live.daemon
      AXON_LIVE_MENU_LABEL: dev.axon.live.menu
      AXON_DIST_MAIN: dist/Axon.app/Contents/MacOS/Axon
      AXON_DIST_MENU: dist/Axon.app/Contents/Library/Applications/Axon Menu.app/Contents/MacOS/AxonMenu
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unlock signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.BGLAB_MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo '::error::BGLAB_MAC_KEYCHAIN_PASSWORD secret is not set'; exit 1
          fi
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db

      # Checkout does not remove ignored files from this reused workspace. A prior branch's Swift
      # incremental records can otherwise make the package build omit changed sources.
      - name: Remove prior Swift build state
        run: rm -rf .build

      - name: Build the signed app
        env:
          AXON_CODESIGN_IDENTITY: 2A1FE6185D48E55E22FA9DB390B452D2E06AD665
        run: ./scripts/package-app

      # A live runner is also somebody's desktop, so an installed Axon serving the endpoint is the
      # normal case rather than a reason to refuse. It is parked once for the whole job rather than
      # from inside the probe, and the last step puts it back. The probe's candidate serves a
      # private socket of its own, so parking is not what keeps the candidate's answers honest --
      # the pid and provenance checks do that -- it is what keeps two daemons from driving one
      # desktop's Accessibility tree and two menus from sitting in one menu bar.
      - name: Park the installed Axon daemon
        run: |
          set -euo pipefail
          cli="$PWD/dist/Axon.app/Contents/Resources/bin/axon"
          uid="$(id -u)"

          # A candidate that outlived an earlier job, which `if: always()` cannot prevent because a
          # killed runner runs nothing. Its private jobs would make the probe's bootstrap fail as
          # already loaded, and a process launchd no longer tracks would be a second candidate the
          # pid check could only guess between.
          scripts/stop-probe-app \
            --launchd-label "$AXON_LIVE_MENU_LABEL" --launchd-label "$AXON_LIVE_DAEMON_LABEL" \
            "$PWD/$AXON_DIST_MAIN" "$PWD/$AXON_DIST_MENU"

          # Whether each job was live when the job arrived, which is the only fact that says what
          # the restore owes this machine. The plists cannot answer it: `shutdown` boots both jobs
          # out and deliberately leaves the registration on disk, so a machine this job unloaded
          # still reads as registered. `launchctl print` exits non-zero for a label that is not
          # loaded in the domain. The two are recorded separately because either can be loaded
          # without the other, and the restore must not add a job the desktop was not running.
          daemon_was_loaded=false
          if launchctl print "gui/$uid/$AXON_LAUNCH_AGENT_LABEL" >/dev/null 2>&1; then
            daemon_was_loaded=true
          fi
          # The process launchd is running for the desktop's daemon, so the stop below can be
          # confirmed against the process rather than against the endpoint.
          desktop_daemon_pid="$(launchctl print "gui/$uid/$AXON_LAUNCH_AGENT_LABEL" 2>/dev/null | awk '/^[[:space:]]*pid = / { print $3; exit }' || true)"
          menu_was_loaded=false
          if launchctl print "gui/$uid/$AXON_MENU_AGENT_LABEL" >/dev/null 2>&1; then
            menu_was_loaded=true
          fi
          # Handed to the restore step before anything is stopped, so a machine the stop below
          # fails on still gets its jobs back.
          {
            echo "AXON_DAEMON_WAS_LOADED=$daemon_was_loaded"
            echo "AXON_MENU_WAS_LOADED=$menu_was_loaded"
          } >> "$GITHUB_ENV"
          echo "found this desktop as: $AXON_LAUNCH_AGENT_LABEL loaded=$daemon_was_loaded, $AXON_MENU_AGENT_LABEL loaded=$menu_was_loaded"

          # The labels above are this workflow's copy of `LaunchAgentConfiguration`'s, and nothing
          # makes the two agree. Drift would fail in the worst way available: `launchctl print`
          # would report the desktop's job as not loaded, `shutdown` would boot it out under the
          # CLI's own label regardless, and the restore would then leave the machine stopped on
          # purpose. The CLI computes `registration.registered` from its own daemon label's plist
          # path and names every job it supervises in `registration.jobs`, so a registration it can
          # see where this job cannot name one, or a job label this job does not know, is exactly
          # that disagreement, caught before anything is stopped.
          registration="$("$cli" status --json)"
          if printf '%s' "$registration" | jq -e '.registration.registered' >/dev/null \
            && [ ! -e "$HOME/Library/LaunchAgents/$AXON_LAUNCH_AGENT_LABEL.plist" ]; then
            echo "::error::the CLI reports a LaunchAgent registration, but none exists at ~/Library/LaunchAgents/$AXON_LAUNCH_AGENT_LABEL.plist; AXON_LAUNCH_AGENT_LABEL has drifted from LaunchAgentConfiguration and this job cannot address this desktop's agent"
            exit 1
          fi
          unknown_jobs="$(printf '%s' "$registration" | jq -r --arg daemon "$AXON_LAUNCH_AGENT_LABEL" --arg menu "$AXON_MENU_AGENT_LABEL" \
            '[.registration.jobs[]?.label | select(. != $daemon and . != $menu)] | join(" ")')"
          if [ -n "$unknown_jobs" ]; then
            echo "::error::the CLI supervises job(s) $unknown_jobs that this workflow does not name; AXON_LAUNCH_AGENT_LABEL or AXON_MENU_AGENT_LABEL has drifted from LaunchAgentConfiguration and this job cannot record or restore them"
            exit 1
          fi

          # The menu goes first, and by name, so that it is never left running against an endpoint
          # nobody serves -- its KeepAlive relaunches it on a crash, and a menu whose daemon
          # vanished is what such a crash looks like. A label that is not loaded is the expected
          # answer on a desktop without a menu, so the bootout is tolerated and its outcome is
          # checked instead.
          launchctl bootout "gui/$uid/$AXON_MENU_AGENT_LABEL" >/dev/null 2>&1 || true
          if launchctl print "gui/$uid/$AXON_MENU_AGENT_LABEL" >/dev/null 2>&1; then
            echo "::error::$AXON_MENU_AGENT_LABEL is still loaded after bootout; refusing to stop the daemon underneath a menu this job could not park"
            exit 1
          fi

          # The build under test does the stopping, and deliberately not the installed
          # `/opt/homebrew/bin/axon`: a runner's installed CLI is whichever release it last
          # installed, so a verb that release predates fails there, and `|| true` swallows it. That
          # is not hypothetical -- the macOS runner's installed binary had no `shutdown` at all,
          # which made this whole protection a no-op that nothing reported.
          #
          # Untolerated for the same reason. `shutdown` boots the jobs out before asking the daemon
          # to exit, so `KeepAlive` cannot relaunch it in the gap, and it exits non-zero while
          # anything is still answering.
          "$cli" shutdown

          # Nothing answering is not the same as nothing running: a daemon can close its endpoint
          # and still be tearing down. The next step bootstraps the candidate, so it waits here for
          # the desktop's daemon process to be gone rather than starting one beside it. `ps`, not
          # `kill -0`, because only a command on PATH can be rehearsed by the recovery harness.
          if [ -n "$desktop_daemon_pid" ]; then
            for _ in {1..40}; do
              ps -p "$desktop_daemon_pid" >/dev/null 2>&1 || break
              sleep 0.25
            done
            if ps -p "$desktop_daemon_pid" >/dev/null 2>&1; then
              echo "::error::the desktop's daemon (pid $desktop_daemon_pid) is still running 10 s after shutdown stopped answering; refusing to start the candidate beside it"
              exit 1
            fi
            echo "the desktop's daemon (pid $desktop_daemon_pid) has exited"
          fi

      - name: Capture, resolve, act, and verify
        run: |
          set -euo pipefail
          cli="$PWD/dist/Axon.app/Contents/Resources/bin/axon"
          dist_main="$PWD/$AXON_DIST_MAIN"
          dist_menu="$PWD/$AXON_DIST_MENU"
          uid="$(id -u)"
          daemon_plist="$RUNNER_TEMP/$AXON_LIVE_DAEMON_LABEL.plist"
          menu_plist="$RUNNER_TEMP/$AXON_LIVE_MENU_LABEL.plist"
          # The jobs' logs live under /tmp, where scripts/macos-cutover-qualification's jobs and
          # hand-launched reproductions write theirs, rather than inside the runner's own temporary
          # directory: launchd opens these paths for the job before it runs, and a path it cannot
          # open there is a failure with no log to show for it. The directory is created here so
          # that launchd only ever has to create the file. Per run for the socket's reason below.
          log_dir="/tmp/axon-live-${GITHUB_RUN_ID}.logs"
          rm -rf "$log_dir"
          mkdir -m 700 "$log_dir"
          daemon_log="$log_dir/$AXON_LIVE_DAEMON_LABEL.log"
          menu_log="$log_dir/$AXON_LIVE_MENU_LABEL.log"
          # The candidate's own endpoint, exported so that every client below -- `status`, `mcp`,
          # `run`, and the assertion script -- talks to it and to nothing else. Per run, because a
          # re-run attempt of a cancelled run shares its id and the restore removes the file.
          export AXON_SOCKET_PATH="/tmp/axon-live-${GITHUB_RUN_ID}.sock"

          if pgrep -x Calculator >/dev/null; then
            echo '::error::Calculator is already running; refusing to alter an existing desktop session.'
            exit 1
          fi
          # Calculator alone, because it is the only desktop state this step owns. The candidate's
          # jobs and the desktop's own belong to the restore step instead: a trap cannot run when
          # the runner cancels the job, and putting a machine's start-at-login daemon back is not
          # something to leave to a handler that a cancellation skips.
          trap 'killall Calculator >/dev/null 2>&1 || true' EXIT

          for executable in "$dist_main" "$dist_menu"; do
            if [[ ! -x "$executable" ]]; then
              echo "::error::$executable is not in the built bundle; scripts/package-app did not produce the two-job layout this lane launches"
              exit 1
            fi
          done

          # The candidate runs as launchd gui-domain jobs, the way an installed Axon runs, because
          # that is the only launch whose privacy grants are its own: a process started from this
          # runner's shell is attributed to whatever the runner was launched by, and `open -n`
          # would take the main executable's launcher path -- with no argument and no managed key
          # it runs the bundle's `axon start`, which acts on the desktop's production registration
          # and never serves. Written with plistlib so a workspace path is escaped, not pasted.
          python3 - "$daemon_plist" "$AXON_LIVE_DAEMON_LABEL" "$dist_main" "$daemon_log" \
            "$menu_plist" "$AXON_LIVE_MENU_LABEL" "$dist_menu" "$menu_log" "$AXON_SOCKET_PATH" <<'PY'
          import plistlib, sys
          (daemon_plist, daemon_label, daemon_exe, daemon_log,
           menu_plist, menu_label, menu_exe, menu_log, socket) = sys.argv[1:]
          def write(path, job):
              with open(path, "wb") as handle:
                  plistlib.dump(job, handle)
          # RunAtLoad because KeepAlive is false: without it a bootstrap loads the job and starts
          # nothing. KeepAlive is false so a candidate that crashes stays crashed and is reported,
          # instead of being relaunched under a new pid the assertions would chase.
          write(daemon_plist, {
              "Label": daemon_label,
              "ProgramArguments": [daemon_exe],
              "EnvironmentVariables": {"AXON_SOCKET_PATH": socket, "AXON_DAEMON_MANAGED_BY_LAUNCHD": "1"},
              "RunAtLoad": True,
              "KeepAlive": False,
              "LimitLoadToSessionType": "Aqua",
              "ProcessType": "Interactive",
              "StandardOutPath": daemon_log,
              "StandardErrorPath": daemon_log,
          })
          write(menu_plist, {
              "Label": menu_label,
              "ProgramArguments": [menu_exe],
              "EnvironmentVariables": {"AXON_SOCKET_PATH": socket},
              "RunAtLoad": True,
              "KeepAlive": False,
              "LimitLoadToSessionType": "Aqua",
              "StandardOutPath": menu_log,
              "StandardErrorPath": menu_log,
          })
          PY
          # Read back from disk rather than trusted from the writer, because this is the check that
          # stands between a lane and the desktop's production registration: a daemon plist without
          # the managed key launches the main executable down its launcher path.
          python3 - "$daemon_plist" "$dist_main" <<'PY'
          import plistlib, sys
          path, executable = sys.argv[1:]
          with open(path, "rb") as handle:
              job = plistlib.load(handle)
          problems = []
          if job.get("ProgramArguments") != [executable]:
              problems.append(f"ProgramArguments is {job.get('ProgramArguments')!r}, not exactly [{executable!r}]")
          if job.get("EnvironmentVariables", {}).get("AXON_DAEMON_MANAGED_BY_LAUNCHD") != "1":
              problems.append("it does not set AXON_DAEMON_MANAGED_BY_LAUNCHD=1, so the main executable would take its launcher path and run this bundle's `axon start` against the desktop's production registration")
          for problem in problems:
              print(f"::error::refusing to bootstrap {path}: {problem}")
          sys.exit(1 if problems else 0)
          PY

          # Every failure from here to a serving candidate prints launchd's account of the job while
          # the label is still loaded: a candidate that dies before writing to its log leaves no
          # other evidence, and the restore step boots the label out.
          if ! launchctl bootstrap "gui/$uid" "$daemon_plist"; then
            echo "::error::launchctl could not bootstrap $AXON_LIVE_DAEMON_LABEL from $daemon_plist"
            scripts/launchd-job-evidence "$AXON_LIVE_DAEMON_LABEL" "$daemon_log"
            exit 1
          fi
          # launchd's own answer for which process it started, never a process-table search: the
          # label is this job's alone, so the pid it names is the candidate by construction.
          job_pid() {
            launchctl print "gui/$uid/$1" 2>/dev/null | awk '/^[[:space:]]*pid = / { print $3; exit }' || true
          }
          daemon_pid=""
          for _ in {1..40}; do
            daemon_pid="$(job_pid "$AXON_LIVE_DAEMON_LABEL")"
            if [[ -n "$daemon_pid" ]]; then
              break
            fi
            sleep 0.25
          done
          if [[ -z "$daemon_pid" ]]; then
            echo "::error::launchd loaded $AXON_LIVE_DAEMON_LABEL but is not running it; the candidate daemon never launched or exited before it could serve"
            scripts/launchd-job-evidence "$AXON_LIVE_DAEMON_LABEL" "$daemon_log"
            exit 1
          fi

          # Everything below is a client of the endpoint, so this is what makes the document
          # evidence about the process launchd started from this build rather than about whichever
          # daemon is listening. The label makes its liveness launchd's answer, read afresh each
          # time, rather than a signal to a pid read once while launchd may still have been
          # spawning the job.
          scripts/assert-daemon-under-test --launchd-label "$AXON_LIVE_DAEMON_LABEL" \
            "$cli" "$daemon_pid" "$daemon_log"

          # The published contract, checked against a real logged-in Mac.
          expected_version="$(cat VERSION)"
          # A local binary invocation, so a statement about the checkout rather than about the
          # daemon. The document's own versions below are the daemon's claim, and the pid
          # assertion is what makes that claim about this build.
          test "$("$cli" version)" = "$expected_version"
          status="$("$cli" status --json)"
          # Every claim is read out of this one document, so each describes the one process the
          # pid names.
          require() {
            if ! printf '%s' "$status" | jq -e --argjson pid "$daemon_pid" --arg version "$expected_version" "$1" >/dev/null; then
              echo "::error::the candidate's health-v1 document does not hold: $2"
              printf '%s\n' "$status" | jq '{version, platform, daemon, registration}'
              exit 1
            fi
          }
          require '.schemaVersion == "health-v1"' 'schemaVersion is health-v1'
          require '.daemon.processId == $pid' "the endpoint is served by launchd's $AXON_LIVE_DAEMON_LABEL (pid $daemon_pid)"
          require '.version == $version' 'the document reports VERSION'
          require '.platform == "macos"' 'platform is macos'
          require '.daemon.running and .daemon.ready' 'the daemon is running and ready'
          require '.session.interactive and .session.graphical' 'the session is interactive and graphical'
          # Which runtime answered, by its own account. The backend name is what tells the Rust
          # daemon from a Swift one reporting the same version, and the executable is what ties it
          # to this workspace's bundle rather than to an installed copy.
          require '.daemon.provenance.backend == "rust-axon-mac"' 'provenance names the Rust axon-mac backend'
          require '.daemon.provenance.processId == $pid' 'provenance names the launchd-started pid'
          require '.daemon.provenance.version == $version' 'provenance reports VERSION'
          require '.daemon.shellContract == 1' 'the daemon publishes shell contract 1 to the menu'
          # The complete vocabulary, every unusable entry explained. Not all usable: axon-mac
          # honestly reports observeChanges as not-implemented.
          require '.capabilities | length == 15' 'all 15 capabilities are reported'
          require '[.capabilities[] | select(.usable == false and (.reason // "") == "")] | length == 0' 'every unusable capability carries a reason'
          require '[.permissions[] | select(.name == "accessibility")][0].granted == true' 'Accessibility is granted to the candidate'
          # Compared physically, because the runner's workspace may sit behind a symlink and the
          # daemon reports the path it was executed by.
          physical_path() {
            ( cd -P "$(dirname "$1")" 2>/dev/null && printf '%s/%s\n' "$(pwd -P)" "$(basename "$1")" ) || true
          }
          served_executable="$(printf '%s' "$status" | jq -r '.daemon.provenance.executablePath // ""')"
          if [[ -z "$served_executable" || "$(physical_path "$served_executable")" != "$(physical_path "$dist_main")" ]]; then
            echo "::error::the serving daemon reports executable ${served_executable:-<none>}, not this build's $dist_main"
            exit 1
          fi
          echo "the Rust daemon from this build (pid $daemon_pid) is serving $AXON_SOCKET_PATH and Accessibility is granted"

          # The menu half of the registration, started only once its daemon is ready -- the order
          # an installed Axon's own restart uses.
          if ! launchctl bootstrap "gui/$uid" "$menu_plist"; then
            echo "::error::launchctl could not bootstrap $AXON_LIVE_MENU_LABEL from $menu_plist"
            scripts/launchd-job-evidence "$AXON_LIVE_MENU_LABEL" "$menu_log"
            exit 1
          fi
          menu_pid=""
          for _ in {1..40}; do
            menu_pid="$(job_pid "$AXON_LIVE_MENU_LABEL")"
            if [[ -n "$menu_pid" ]]; then
              break
            fi
            sleep 0.25
          done
          if [[ -z "$menu_pid" ]]; then
            echo "::error::launchd loaded $AXON_LIVE_MENU_LABEL but is not running it; the candidate menu never launched"
            scripts/launchd-job-evidence "$AXON_LIVE_MENU_LABEL" "$menu_log"
            exit 1
          fi
          echo "the candidate menu is running as pid $menu_pid"

          open -a Calculator
          look=""
          look_error=""
          ready=false
          for _ in {1..40}; do
            if candidate="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator"}}}' | "$cli" mcp 2>&1)"; then
              look="$candidate"
              if printf '%s' "$look" | jq -e '
                .result.isError == false
                and (.result.structuredContent.app | strings | length > 0)
                and ([.result.content[] | select(.type == "image" and .mimeType == "image/png" and (.data | length > 0))] | length == 1)
                and ([.result.structuredContent.tree | split("\n")[] | select(test(": button \"All Clear\" \\[click\\]"))] | length == 1)
                and ([.result.structuredContent.tree | split("\n")[] | select(test(": button \"1\" \\[click\\]"))] | length == 1)
              ' >/dev/null; then
                ready=true
                break
              fi
            else
              look_error="$candidate"
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            echo '::error::Calculator did not expose uniquely named All Clear and digit 1 buttons before the resolve deadline'
            if [[ -n "$look" ]]; then
              printf '%s\n' "$look" | jq '{
                isError: .result.isError,
                observation: (.result.structuredContent | {app, tree: (.tree | split("\n") | map(select(test(": button "))) | .[0:20])}),
                error: (.result.structuredContent | {code, message, error})
              }'
            elif [[ -n "$look_error" ]]; then
              printf 'last look error: %.500s\n' "$look_error"
            fi
            exit 1
          fi
          retained_app="$(printf '%s' "$look" | jq -r '.result.structuredContent.app')"
          clear_name="$(printf '%s' "$look" | jq -r '[.result.structuredContent.tree | split("\n")[] | select(test(": button \"All Clear\" \\[click\\]")) | capture("^\\s*(?<name>.+): button").name][0]')"
          one_name="$(printf '%s' "$look" | jq -r '[.result.structuredContent.tree | split("\n")[] | select(test(": button \"1\" \\[click\\]")) | capture("^\\s*(?<name>.+): button").name][0]')"
          echo 'Calculator All Clear and digit 1 buttons have retained app-scoped semantic names'

          shallow="$(printf '%s\n' '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator","screenshot":false,"childDepth":0,"depth":0,"frames":false}}}' | "$cli" mcp)"
          if ! printf '%s' "$shallow" | jq -e '
            .result.isError == false
            and ([.result.content[] | select(.type == "image")] | length == 0)
            and (.result.structuredContent.tree | split("\n") | all((startswith("  ") or test(": window "))))
          ' >/dev/null; then
            echo '::error::Calculator shallow look did not honor childDepth, depth, frames, and screenshot controls'
            printf '%s\n' "$shallow" | jq .
            exit 1
          fi

          child_page="$(jq -cn --arg app "$retained_app" --arg name "$clear_name" '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"look","arguments":{"target":{"app":$app,"name":$name},"offset":0,"limit":1,"direct":true}}}' | "$cli" mcp)"
          if ! printf '%s' "$child_page" | jq -e '
            .result.isError == false
            and .result.structuredContent.children.format == "children"
            and .result.structuredContent.children.offset == 0
            and .result.structuredContent.children.limit == 1
            and .result.structuredContent.children.total >= 0
            and ([.result.content[] | select(.type == "image")] | length == 0)
          ' >/dev/null; then
            echo '::error::Calculator semantic child page did not expose bounded imageless metadata'
            printf '%s\n' "$child_page" | jq .
            exit 1
          fi

          clear_invoked="$(jq -cn --arg app "$retained_app" --arg name "$clear_name" '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"invoke","arguments":{"target":{"app":$app,"name":$name},"name":"AXPress"}}}' | "$cli" mcp)"
          if ! printf '%s' "$clear_invoked" | jq -e '.result.isError == false and .result.structuredContent.action.success == true and .result.structuredContent.action.targetResolution.status == "unique"' >/dev/null; then
            echo '::error::Calculator All Clear semantic name did not resolve uniquely and dispatch'
            printf '%s\n' "$clear_invoked" | jq .
            exit 1
          fi
          echo 'Calculator All Clear button pressed'

          one_invoked="$(jq -cn --arg app "$retained_app" --arg name "$one_name" '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"invoke","arguments":{"target":{"app":$app,"name":$name},"name":"AXPress"}}}' | "$cli" mcp)"
          if ! printf '%s' "$one_invoked" | jq -e '.result.isError == false and .result.structuredContent.action.success == true and .result.structuredContent.action.targetResolution.status == "unique"' >/dev/null; then
            echo '::error::Calculator digit 1 semantic name did not resolve uniquely and dispatch'
            printf '%s\n' "$one_invoked" | jq .
            exit 1
          fi
          echo 'Calculator digit 1 pressed'

          verified=false
          after=""
          after_error=""
          for _ in {1..20}; do
            if candidate="$(printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator"}}}' | "$cli" mcp 2>&1)"; then
              after="$candidate"
              if printf '%s' "$after" | jq -e '.result.isError == false and (.result.structuredContent.tree | test(": text \"[^\"]*1[^\"]*\""))' >/dev/null; then
                verified=true
                break
              fi
            else
              after_error="$candidate"
            fi
            sleep 0.1
          done
          if [[ "$verified" != true ]]; then
            echo '::error::Calculator display did not show digit 1 after the semantic invocation'
            if [[ -n "$after" ]]; then
              printf '%s\n' "$after" | jq '{
                isError: .result.isError,
                display: [.result.structuredContent.tree | split("\n")[] | select(test(": text "))][0:20],
                error: (.result.structuredContent | {code, message, error})
              }'
            elif [[ -n "$after_error" ]]; then
              printf 'last look error: %.500s\n' "$after_error"
            fi
            exit 1
          fi
          echo 'Calculator display verified'

          # `look(since:)`. A change check is only evidence if it can also say "unchanged", so the
          # window is first observed until a check against the previous token reports nothing new
          # -- which is also what lets the display settle after the press above -- and only then
          # is a button pressed and the same baseline asked again. A daemon that answered
          # "changed" to everything would pass the second half alone.
          since_look() {
            jq -cn --arg since "$1" '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator","since":$since}}}' | "$cli" mcp
          }
          baseline="$(printf '%s\n' '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator","screenshot":false}}}' | "$cli" mcp)"
          since_token="$(printf '%s' "$baseline" | jq -r '.result.structuredContent.since // empty')"
          if [[ -z "$since_token" ]]; then
            echo '::error::a full look at Calculator returned no since token'
            printf '%s\n' "$baseline" | jq '{isError: .result.isError, keys: (.result.structuredContent | keys?)}'
            exit 1
          fi
          settled=false
          check=""
          for _ in {1..20}; do
            check="$(since_look "$since_token")"
            if printf '%s' "$check" | jq -e '.result.isError == false and .result.structuredContent.unchanged == true' >/dev/null; then
              settled=true
              break
            fi
            since_token="$(printf '%s' "$check" | jq -r '.result.structuredContent.since // empty')"
            if [[ -z "$since_token" ]]; then
              break
            fi
            sleep 0.1
          done
          if [[ "$settled" != true ]]; then
            echo '::error::look(since:) never reported an untouched Calculator as unchanged'
            printf '%s\n' "$check" | jq '{isError: .result.isError, result: (.result.structuredContent | del(.observation))}'
            exit 1
          fi
          # Pressed after the settle; the token checked against is the settled one, which the
          # unchanged answer itself carries.
          if ! jq -cn --arg app "$retained_app" --arg name "$clear_name" '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"invoke","arguments":{"target":{"app":$app,"name":$name},"name":"AXPress"}}}' | "$cli" mcp \
            | jq -e '.result.isError == false and .result.structuredContent.action.success == true' >/dev/null; then
            echo '::error::Calculator All Clear did not dispatch for the change check'
            exit 1
          fi
          changed=false
          for _ in {1..20}; do
            check="$(since_look "$since_token")"
            # A diff, or the full observation the daemon returns when the diff is too large to be
            # worth sending. A baseline-expired fallback is not a change report: it means the token
            # was forgotten.
            if printf '%s' "$check" | jq -e '
              .result.isError == false
              and (.result.structuredContent.unchanged // false) == false
              and (.result.structuredContent.diff != null or .result.structuredContent.note == "diff-exceeded-threshold")
            ' >/dev/null; then
              changed=true
              break
            fi
            sleep 0.1
          done
          if [[ "$changed" != true ]]; then
            echo '::error::look(since:) did not report the change All Clear made to Calculator'
            printf '%s\n' "$check" | jq '{isError: .result.isError, result: (.result.structuredContent | del(.observation))}'
            exit 1
          fi
          echo 'look(since:) reported unchanged before the press and a change after it'

          # OCR over the window's own pixels. Calculator always shows digits -- the display and
          # the keypad -- so a recognizer that returns none has not read this window.
          screen="$(printf '%s\n' '{"jsonrpc":"2.0","id":8,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator","screenshot":false,"screenText":true}}}' | "$cli" mcp)"
          if ! printf '%s' "$screen" | jq -e '
            .result.isError == false
            and ([.result.structuredContent.screenText[]?.text | strings | select(test("[0-9]"))] | length > 0)
          ' >/dev/null; then
            echo '::error::look with screenText did not recognize any Calculator digit'
            printf '%s\n' "$screen" | jq '{isError: .result.isError, screenText: .result.structuredContent.screenText, screenTextUnavailable: .result.structuredContent.screenTextUnavailable, error: .result.structuredContent.error}'
            exit 1
          fi
          echo "screenText recognized: $(printf '%s' "$screen" | jq -c '[.result.structuredContent.screenText[]?.text] | .[0:12]')"

          # A recording the production Swift daemon made, replayed by this build: the compatibility
          # promise the flip from Swift to Rust rests on. Skipped until the qualification commits
          # the recording, and loud about it, so a green lane cannot be read as having replayed it.
          replay="$PWD/scripts/macos-toolkit-acceptance/live/axn125/calculator-swift-0.3.6.axn"
          if [[ ! -f "$replay" ]]; then
            echo "::notice::$replay is not committed yet; skipping the Swift-recorded replay probe"
          else
            replay_status=0
            replay_output="$("$cli" run "$replay" 2>&1)" || replay_status=$?
            if [[ "$replay_status" != 0 ]] || ! printf '%s' "$replay_output" | jq -e '.error == null and .result.success == true' >/dev/null 2>&1; then
              echo "::error::replaying $replay failed (exit $replay_status)"
              printf '%s\n' "$replay_output" | jq '{error, success: .result.success, failed: [.result.trace[]? | select(.success != true) | {index, tool, error}]}' 2>/dev/null \
                || printf '%.2000s\n' "$replay_output"
              exit 1
            fi
            echo "replayed $replay successfully"
          fi

          # The menu has been talking to the candidate for the whole probe; one that died on any
          # of it would otherwise pass unnoticed, because nothing above is its client.
          if [[ -z "$(job_pid "$AXON_LIVE_MENU_LABEL")" ]]; then
            echo "::error::the candidate menu ($AXON_LIVE_MENU_LABEL, pid $menu_pid) is no longer running after the probes"
            scripts/launchd-job-evidence --pid "$menu_pid" "$AXON_LIVE_MENU_LABEL" "$menu_log"
            exit 1
          fi
          echo 'the candidate menu survived the probes'

      # The counterpart to the parking step, and the reason the probe above may leave the machine
      # in whatever state it failed in. `always()` because a failed probe is exactly when the
      # desktop most needs its own daemon back.
      #
      # It needs a step of its own rather than a trap because `shutdown` is not a pause: it boots
      # both jobs out so `KeepAlive` cannot relaunch them mid-request, and they then stay unloaded
      # for the rest of the login session. A job that calls it owes this machine a bootstrap, and
      # a trap inside a step that the runner cancels never runs.
      - name: Restore the installed Axon daemon
        if: always()
        run: |
          set -euo pipefail
          # Only the probe exports the candidate's socket, but this step must address the
          # desktop's endpoint, and a value inherited from anywhere would aim `daemon restart`'s
          # readiness wait and every status read below at the candidate instead.
          unset AXON_SOCKET_PATH
          cli="$GITHUB_WORKSPACE/dist/Axon.app/Contents/Resources/bin/axon"
          uid="$(id -u)"
          agents="$HOME/Library/LaunchAgents"

          # The candidate goes first, and unconditionally: its labels are this job's alone, so
          # there is nothing of the desktop's here to leave alone. A survivor no longer holds the
          # desktop's endpoint -- it served a private one -- so it does not stand in the way of the
          # restore; it is recorded and fails the step after the desktop has its daemon back.
          killall Calculator >/dev/null 2>&1 || true
          sweep_failed=false
          scripts/stop-probe-app \
            --launchd-label "$AXON_LIVE_MENU_LABEL" --launchd-label "$AXON_LIVE_DAEMON_LABEL" \
            "$GITHUB_WORKSPACE/$AXON_DIST_MAIN" "$GITHUB_WORKSPACE/$AXON_DIST_MENU" || sweep_failed=true
          rm -f "$RUNNER_TEMP/$AXON_LIVE_DAEMON_LABEL.plist" "$RUNNER_TEMP/$AXON_LIVE_MENU_LABEL.plist" \
            "/tmp/axon-live-${GITHUB_RUN_ID}.sock"
          rm -rf "/tmp/axon-live-${GITHUB_RUN_ID}.logs"
          finish() {
            if [ "$sweep_failed" = true ]; then
              echo '::error::a candidate process survived its jobs being booted out; this runner needs attention before the next live run'
              exit 1
            fi
            exit 0
          }
          job_pid() {
            launchctl print "gui/$uid/$1" 2>/dev/null | awk '/^[[:space:]]*pid = / { print $3; exit }' || true
          }
          job_loaded() {
            launchctl print "gui/$uid/$1" >/dev/null 2>&1
          }

          # Set only by the parking step, and the reason this step may start anything at all:
          # without it the job never touched this desktop.
          if [ -z "${AXON_DAEMON_WAS_LOADED:-}" ]; then
            echo 'the installed daemon was never parked; leaving the desktop alone'
            finish
          fi
          menu_was_loaded="${AXON_MENU_WAS_LOADED:-false}"

          if [ "$AXON_DAEMON_WAS_LOADED" != true ]; then
            if [ "$menu_was_loaded" = true ]; then
              # A menu with no daemon is an odd desktop, but it is the one this job found, and
              # `daemon restart` would add the daemon it did not have.
              launchctl bootstrap "gui/$uid" "$agents/$AXON_MENU_AGENT_LABEL.plist" || true
              if ! job_loaded "$AXON_MENU_AGENT_LABEL"; then
                echo "::error::this job parked $AXON_MENU_AGENT_LABEL and could not load it again"
                tail -20 "$HOME/Library/Logs/Axon/menu.err.log" 2>/dev/null || true
                exit 1
              fi
              echo "restored $AXON_MENU_AGENT_LABEL; no daemon was loaded when the job arrived"
            else
              echo 'this desktop had no Axon job loaded when the job arrived; leaving it stopped'
            fi
            finish
          fi

          # `daemon restart`, never `daemon install`: restart bootstraps the plists that are on
          # disk without rewriting them, while install would repoint the desktop's registration at
          # the invoking binary -- here a `dist` directory the next run overwrites. The build under
          # test asks, because the installed CLI is whichever release this desktop last installed
          # and need not carry the verb at all. It loads the daemon, waits for it to be ready, and
          # only then loads the menu, which is the order this step needs.
          #
          # Its status is recorded rather than acted on. Its readiness wait parses the answer with
          # *this* build's decoder, so release skew -- the pid comparison below tolerates a
          # document too old to name a process -- would fail it for a daemon that came back
          # perfectly, and a wait that fails never reaches the menu. The verdict is the checks
          # below; this output is for the diagnosis when they fail.
          restart_status=0
          restart_output="$("$cli" daemon restart 2>&1)" || restart_status=$?
          printf '%s\n' "$restart_output"
          echo "daemon restart exited $restart_status"

          # Not trusted on its exit code either way: `launchctl bootstrap` returning zero is a
          # claim about loading a job, not about one serving. Read together on purpose, so the
          # pair below describes one moment rather than two.
          answering=false
          status=""
          agent_pid=""
          for _ in {1..40}; do
            status="$("$cli" status --json)"
            agent_pid="$(job_pid "$AXON_LAUNCH_AGENT_LABEL")"
            if printf '%s' "$status" | jq -e '.daemon.running' >/dev/null; then
              answering=true
              break
            fi
            sleep 0.25
          done
          if [[ "$answering" != true ]]; then
            echo "::error::the desktop Axon daemon did not come back at $(printf '%s' "$status" | jq -r '.daemon.endpoint'); this runner needs attention before the next live run"
            printf -- '--- daemon restart ---\n%s\n' "$restart_output"
            launchctl print "gui/$uid/$AXON_LAUNCH_AGENT_LABEL" 2>&1 | head -20 || true
            tail -20 "$HOME/Library/Logs/Axon/daemon.err.log" 2>/dev/null || true
            exit 1
          fi

          # A daemon answering is not the agent running. Both halves are required, because the two
          # failures look nothing alike to whoever reads this next: an agent that never came back,
          # or an agent that is unloaded while something else answers on its endpoint -- which is
          # the case that leaves the next bootstrap dead on an address already in use.
          if [ -z "$agent_pid" ]; then
            echo "::error::a daemon is answering at $(printf '%s' "$status" | jq -r '.daemon.endpoint') but launchd is not running $AXON_LAUNCH_AGENT_LABEL; this desktop's start-at-login registration is still booted out"
            printf -- '--- daemon restart ---\n%s\n' "$restart_output"
            exit 1
          fi
          # Exact whenever the document allows it. A daemon this build can parse names its own
          # process, so requiring that to be launchd's is what rules out a stray answering in the
          # restored daemon's place. A missing pid is tolerated rather than required: this desktop
          # runs whichever release it installed, and a payload this build is too new to parse
          # reports a daemon that is up with no process id at all.
          if printf '%s' "$status" | jq -e '.daemon.processId != null' >/dev/null \
            && ! printf '%s' "$status" | jq -e --argjson pid "$agent_pid" '.daemon.processId == $pid' >/dev/null; then
            echo "::error::$(printf '%s' "$status" | jq -r '.daemon.endpoint') is answered by pid $(printf '%s' "$status" | jq -r '.daemon.processId'), not the restored LaunchAgent (pid $agent_pid)"
            printf -- '--- daemon restart ---\n%s\n' "$restart_output"
            exit 1
          fi

          if [ "$menu_was_loaded" = true ]; then
            # Loaded here only when the restart's own readiness wait failed before reaching it;
            # the daemon is verified by now, so the order still holds.
            if ! job_loaded "$AXON_MENU_AGENT_LABEL"; then
              launchctl bootstrap "gui/$uid" "$agents/$AXON_MENU_AGENT_LABEL.plist" || true
            fi
            if ! job_loaded "$AXON_MENU_AGENT_LABEL"; then
              echo "::error::the desktop's daemon is answering again, but $AXON_MENU_AGENT_LABEL was loaded when this job arrived and is not loaded now"
              printf -- '--- daemon restart ---\n%s\n' "$restart_output"
              launchctl print "gui/$uid/$AXON_MENU_AGENT_LABEL" 2>&1 | head -20 || true
              tail -20 "$HOME/Library/Logs/Axon/menu.err.log" 2>/dev/null || true
              exit 1
            fi
          elif job_loaded "$AXON_MENU_AGENT_LABEL"; then
            # `daemon restart` bounces every job whose plist exists, so a menu that was registered
            # but not running when the job arrived has just been started. Put back as found.
            launchctl bootout "gui/$uid/$AXON_MENU_AGENT_LABEL" >/dev/null 2>&1 || true
            if job_loaded "$AXON_MENU_AGENT_LABEL"; then
              echo "::error::$AXON_MENU_AGENT_LABEL was not loaded when this job arrived, daemon restart loaded it, and it could not be booted out again"
              exit 1
            fi
          fi
          echo 'the desktop Axon daemon is answering again'
          finish

  linux:
    name: Linux live loop
    runs-on: [self-hosted, axon-live-linux]
    concurrency:
      group: axon-live-linux
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      DISPLAY: ":0"
      WAYLAND_DISPLAY: wayland-0
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install screenshot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev clang
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include -I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      # Built once and named as its own step rather than as a side effect of the first probe,
      # because every step below runs this binary and each one is a claim about it.
      - name: Build the daemon under test
        working-directory: rust
        run: cargo build --quiet --locked -p axon-linux

      # A live runner is also somebody's desktop, so an Axon registration already being present --
      # installed, enabled, and serving the socket -- is the normal case rather than a reason to
      # refuse. It is parked once for the whole job rather than once per step, because every probe
      # below starts its own daemon and can only be evidence about this build if that daemon is
      # the one answering. The last step puts the registration back exactly as it was found.
      # Anchored because the X11 job below parks the same registration the same way; one definition
      # keeps the two benches from drifting apart in how they treat a desktop's own daemon.
      - &linux-park-registration
        name: Park the installed Axon registration
        working-directory: rust
        run: |
          set -euo pipefail
          unit="$HOME/.config/systemd/user/axon.service"
          parked=""
          was_enabled=false
          was_active=false
          if [ -e "$unit" ]; then
            if systemctl --user is-enabled axon.service >/dev/null 2>&1; then was_enabled=true; fi
            if systemctl --user is-active axon.service >/dev/null 2>&1; then was_active=true; fi
            parked="$(mktemp)"
            cp -p "$unit" "$parked"
            systemctl --user stop axon.service >/dev/null 2>&1 || true
            systemctl --user disable axon.service >/dev/null 2>&1 || true
            rm -f "$unit"
            systemctl --user daemon-reload >/dev/null 2>&1 || true
            echo "parked the existing registration (enabled=$was_enabled active=$was_active)"
          else
            echo 'no existing registration to park'
          fi
          # Handed to the restore step before the socket is checked, so a machine this step
          # refuses to run on still gets its registration back.
          {
            echo "AXON_UNIT=$unit"
            echo "AXON_PARKED=$parked"
            echo "AXON_WAS_ENABLED=$was_enabled"
            echo "AXON_WAS_ACTIVE=$was_active"
          } >> "$GITHUB_ENV"

          # Removing the registration is not the same as freeing the socket, and stopping the
          # service is asynchronous. Anything still answering here would answer the probes too, so
          # this names it rather than killing a process the job has no way to put back.
          daemon=target/debug/axon-linux
          status=""
          free=false
          for _ in {1..40}; do
            status="$("$daemon" status --json)"
            if printf '%s' "$status" | jq -e '.daemon.running == false' >/dev/null; then
              free=true
              break
            fi
            sleep 0.25
          done
          if [[ "$free" != true ]]; then
            echo "::error::$(printf '%s' "$status" | jq -r '.daemon.endpoint') is still served by pid $(printf '%s' "$status" | jq -r '.daemon.processId // "unknown"') after the registration was parked; nothing below could be evidence about this build while it holds the socket"
            exit 1
          fi
          # Says what it checked. `serve` refuses on a successful connect to the endpoint, which is
          # a narrower question than whether anything answered a health request -- something bound
          # but mute reads as absent here. That case is not lost, it just fails one step later and
          # by name, when the probe's own daemon cannot bind.
          echo 'no daemon is answering on the Axon socket'

      - name: Capture, resolve, act, and verify
        working-directory: rust
        run: |
          set -euo pipefail
          test -S /run/user/1000/at-spi/bus

          if pgrep -u "$(id -u)" -f '[/]usr/bin/gnome-calculator' >/dev/null; then
            echo '::error::GNOME Calculator is already running; refusing to alter an existing desktop session.'
            exit 1
          fi

          daemon=target/debug/axon-linux
          "$daemon" serve >/tmp/axon-linux-daemon.log 2>&1 &
          daemon_pid=$!
          # Bounded for the same reason as the Wayland step: `wait` on a daemon that shutdown could
          # not reach never returns, and the job dies on the timeout instead of the real failure.
          cleanup() {
            "$daemon" shutdown >/dev/null 2>&1 || true
            for _ in {1..40}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -9 "$daemon_pid" >/dev/null 2>&1 || true
            pkill -u "$(id -u)" -f '[/]usr/bin/gnome-calculator' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Everything below is a client of the socket, so this is what makes it evidence about
          # the daemon this step started rather than about whichever one is listening.
          ../scripts/assert-daemon-under-test "$daemon" "$daemon_pid" /tmp/axon-linux-daemon.log

          gnome-calculator --equation 0 >/dev/null 2>&1 &
          ready=false
          for _ in {1..40}; do
            look="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator"}}}' | "$daemon" mcp)"
            if printf '%s' "$look" | jq -e '
              .result.isError == false
              and (.result.structuredContent.app.name | strings | length > 0)
              and .result.structuredContent.screenshotUnavailable.code == "portal-authorization-required"
              and (.result.structuredContent.screenshot? == null)
              and ([.result.structuredContent.app.windows[]?.root | .. | objects | select(.role == "text box" and .value? == "0")] | length == 1)
              and ([.result.structuredContent.app.windows[]?.root | .. | objects | select(.role == "button" and .label? == "1" and (.actions | index("Click")))] | length == 1)
            ' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done

          if [[ "$ready" != true ]]; then
            echo '::error::GNOME Calculator did not expose one display and one named digit 1 button before the resolve deadline'
            printf '%s\n' "$look" | jq '{
              id,
              jsonrpc,
              isError: .result.isError,
              error: (.result.structuredContent | {code, message}),
              app: (.result.structuredContent.app | {identifier, name}),
              targets: ([.result.structuredContent.app.windows[]?.root | .. | objects
                | select(.role? == "text box" or (.role? == "button" and .label? == "1"))
                | {role, label, value, name, identifier, actions}][0:20])
            }'
            exit 1
          fi
          retained_app="$(printf '%s' "$look" | jq -r '.result.structuredContent.app.name')"
          display_object="$(printf '%s' "$look" | jq -r '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "text box" and .value? == "0")][0].identifier')"
          display_name="$(printf '%s' "$look" | jq -r '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "text box" and .value? == "0")][0].name')"
          retained_name="$(printf '%s' "$look" | jq -r '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "button" and .label? == "1" and (.actions | index("Click")))][0].name')"
          echo 'GNOME Calculator display and digit 1 button have retained app-scoped semantic identity'

          # Start the wait before dispatch so this proves polling observes a real transition rather
          # than merely accepting a value that was already present.
          jq -cn --arg app "$retained_app" --arg name "$display_name" '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"wait_for_value","arguments":{"target":{"app":$app,"name":$name},"equals":"01","timeoutMs":5000,"intervalMs":50}}}' \
            | "$daemon" mcp > /tmp/axon-linux-wait-transition.json &
          wait_pid=$!
          sleep 0.1

          # The name came from the earlier observation. Resolution captures the live tree again and
          # scores the recorded locator facts; no second look or public snapshot handle participates.
          invoked="$(jq -cn --arg app "$retained_app" --arg name "$retained_name" '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"invoke","arguments":{"target":{"app":$app,"name":$name},"name":"Click"}}}' | "$daemon" mcp)"
          if ! printf '%s' "$invoked" | jq -e '.result.isError == false and .result.structuredContent.dispatch.success == true and .result.structuredContent.resolution.status == "unique"' >/dev/null; then
            echo '::error::GNOME Calculator digit 1 semantic name did not resolve uniquely and dispatch'
            printf '%s\n' "$invoked" | jq .
            exit 1
          fi

          wait "$wait_pid"
          transitioned="$(cat /tmp/axon-linux-wait-transition.json)"
          if ! printf '%s' "$transitioned" | jq -e '.result.isError == false and .result.structuredContent.wait.success == true and .result.structuredContent.wait.status == "satisfied" and .result.structuredContent.wait.matched.value == "01"' >/dev/null; then
            echo '::error::wait_for_value did not observe the GNOME Calculator display transition from 0 to 01'
            printf '%s\n' "$transitioned" | jq .
            exit 1
          fi

          timed_out="$(jq -cn --arg app "$retained_app" --arg name "$display_name" '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"wait_for_value","arguments":{"target":{"app":$app,"name":$name},"equals":"value-that-never-appears","timeoutMs":0,"intervalMs":10}}}' | "$daemon" mcp)"
          if ! printf '%s' "$timed_out" | jq -e '.result.isError == false and .result.structuredContent.wait.success == false and .result.structuredContent.wait.status == "predicate_timeout"' >/dev/null; then
            echo '::error::wait_for_value did not report its bounded timeout honestly'
            printf '%s\n' "$timed_out" | jq .
            exit 1
          fi
          echo 'Linux MCP facade captured, resolved, invoked, observed a real value transition, and timed out honestly'


      # The rung that must NOT light up here. This runner is a GNOME Wayland session: the
      # compositor refuses synthetic input, and X11 cannot see or restore the foreground even with
      # XWayland running alongside. A delivery here would be a failure rather than a bonus, so
      # proving the refusal is honest on the real Wayland stack is worth as much as proving
      # delivery works on X11. `keyboard` is the probe because it needs no resolved target and
      # rides the same global-input ladder `click` does.
      - name: Refuse global input honestly under Wayland
        working-directory: rust
        run: |
          set -euo pipefail
          daemon=target/debug/axon-linux
          "$daemon" serve >/tmp/axon-linux-wayland.log 2>&1 &
          daemon_pid=$!
          # Bounded on purpose. A daemon that never bound the socket cannot be shut down, and an
          # unbounded `wait` here would block on the live process forever -- turning any failure
          # above into a job timeout that hides which assertion actually failed.
          cleanup() {
            "$daemon" shutdown >/dev/null 2>&1 || true
            for _ in {1..40}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then return 0; fi
              sleep 0.25
            done
            kill -9 "$daemon_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # The daemon binds its socket after AT-SPI comes up, so the first request has to wait for
          # it; without that wait the connect fails with ENOENT and the refusal below is never
          # exercised. Waiting on this daemon's own pid is also what ties the refusal to this build
          # rather than to whatever else might be holding the socket.
          ../scripts/assert-daemon-under-test "$daemon" "$daemon_pid" /tmp/axon-linux-wayland.log

          for policy in backgroundOnly foregroundPermitted; do
            refused="$(jq -cn --arg policy "$policy" '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"keyboard","arguments":{"text":"x","deliveryPolicy":$policy}}}' | "$daemon" mcp)"
            # A refusal is an action result, not a transport error: the request was well formed and
            # the daemon declined.
            printf '%s' "$refused" | jq -e '.result.isError == false' >/dev/null
            printf '%s' "$refused" | jq -e '.result.structuredContent.dispatchSuccess == false' >/dev/null
            printf '%s' "$refused" | jq -e '.result.structuredContent.delivery == null' >/dev/null
            # noDeliveryCandidate rather than foregroundNotPermitted: opting in cannot conjure a
            # device, so the caller must not be sent after a permission that changes nothing.
            printf '%s' "$refused" | jq -e '.result.structuredContent.refusal.reason == "noDeliveryCandidate"' >/dev/null
            printf '%s' "$refused" | jq -e '.result.structuredContent.refusal.message | test("Wayland")' >/dev/null
          done
          echo 'Linux under Wayland withheld the foreground rung at both policies'

          # Observation is a different refusal from delivery and has to be exercised as one. This
          # session is the only place the project can prove it: XWayland answers as a complete X
          # server and does provide RECORD, so a backend that checked the extension alone would
          # start a recording here and capture a desktop that looks empty while the user works.
          # It is also the reason this row exists at all -- there is no listen-only global input
          # protocol on Wayland to fall back to, by design rather than by omission.
          # `recording.*` is a socket method rather than an MCP tool, so it is asked for over the
          # socket this daemon is already serving.
          started="$(../scripts/axon-socket-request '{"jsonrpc":"2.0","id":1,"method":"recording.start","params":{"scope":{"scope":"allApplications"}}}')"
          printf '%s\n' "$started"
          # A transport error, not an action result: the capability is absent rather than declined.
          printf '%s' "$started" | jq -e '.error.code == -32004' >/dev/null
          printf '%s' "$started" | jq -e '.error.data.kind == "capability-unavailable"' >/dev/null
          printf '%s' "$started" | jq -e '.error.data.capability == "observeGlobalInput"' >/dev/null
          # The specific code, not merely "unavailable". A caller has to be able to tell this
          # session -- where the answer is permanent -- from an X server started without RECORD.
          printf '%s' "$started" | jq -e '.error.data.code == "wayland-restricted"' >/dev/null
          printf '%s' "$started" | jq -e '.error.data.reason | test("listen-only")' >/dev/null

          # A refused start must leave no session behind to abandon.
          status="$(../scripts/axon-socket-request '{"jsonrpc":"2.0","id":2,"method":"recording.status","params":{}}')"
          printf '%s' "$status" | jq -e '.result.recording == false' >/dev/null

          # And the same fact in the published health document, so the census, the refusal, and the
          # session's own report cannot drift apart.
          health="$("$daemon" status --json)"
          printf '%s' "$health" | jq -e '.capabilities[] | select(.capability == "observeGlobalInput") | .usable == false and .reason == "wayland-restricted"' >/dev/null
          printf '%s' "$health" | jq -e '.capabilities[] | select(.capability == "hitTest") | .usable == false and .reason == "wayland-restricted"' >/dev/null
          echo 'Linux under Wayland refused recording.start with a typed capability reason'

      # The lifecycle and the published status document, exercised against a real logged-in GNOME
      # session. The desktop's own registration was parked at the top of the job, so `daemon
      # install` registers this build and nothing else, and the restore step below unregisters it
      # even when an assertion here fails.
      - name: Install, report status, shut down, and uninstall
        working-directory: rust
        run: |
          set -euo pipefail
          unit="$HOME/.config/systemd/user/axon.service"
          daemon="$PWD/target/debug/axon-linux"

          expected_version="$(cat ../VERSION)"
          test "$("$daemon" version)" = "$expected_version"

          "$daemon" daemon install
          test "$(systemctl --user is-enabled axon.service)" = enabled

          # Read together on purpose: an `on-failure` restart landing between the two would fail
          # the pid assertion below over a restart rather than over the thing being tested.
          status="$("$daemon" status --json)"
          main_pid="$(systemctl --user show -p MainPID --value axon.service)"
          printf '%s' "$status" | jq -e '.schemaVersion == "health-v1"' >/dev/null
          printf '%s' "$status" | jq -e --arg v "$expected_version" '.version == $v' >/dev/null
          printf '%s' "$status" | jq -e '.platform == "linux"' >/dev/null
          printf '%s' "$status" | jq -e '.daemon.running and .daemon.ready' >/dev/null
          printf '%s' "$status" | jq -e '.session.interactive and .session.graphical' >/dev/null
          printf '%s' "$status" | jq -e --arg p "$daemon" '.registration.registered and .registration.path == $p' >/dev/null
          # For the same reason the probes above check the pid they spawned: the registration is
          # read from the unit file, while everything else in this document comes from whichever
          # daemon answered. Requiring that to be the service just installed is what keeps the two
          # halves describing the same process.
          printf '%s' "$status" | jq -e --argjson pid "$main_pid" '.daemon.processId == $pid' >/dev/null
          # The complete vocabulary, every unusable entry explained.
          printf '%s' "$status" | jq -e '.capabilities | length == 15' >/dev/null
          printf '%s' "$status" | jq -e '[.capabilities[] | select(.usable == false and (.reason // "") == "")] | length == 0' >/dev/null
          # Wayland withdraws synthetic input; the document must say so rather than promise it.
          printf '%s' "$status" | jq -e '[.capabilities[] | select(.capability == "pointerInput")][0] | .usable == false and .reason == "wayland-restricted"' >/dev/null
          # This runner is a desktop with a screen reader running, so its accessibility switch is
          # on and the daemon reads it from the session bus and says so. A stock GNOME session has
          # it off, and every Chromium-family application is then absent from the bus -- a session
          # this lane does not exercise, which is why the environment note in
          # docs/cross-platform.md says so. This assertion is what keeps that note falsifiable: if
          # the runner's accessibility is ever switched off, the note is wrong and this goes red.
          printf '%s' "$status" | jq -e '.session.accessibilityEnabled == true' >/dev/null

          "$daemon" daemon restart
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{}}}' \
            | "$daemon" mcp | jq -e '.result.isError == false' >/dev/null

          "$daemon" shutdown
          # Shutdown leaves the registration in place; only the daemon stops.
          "$daemon" status --json | jq -e '.daemon.running == false and .registration.registered == true' >/dev/null
          # Describing a stopped daemon is a success, not a failure.
          "$daemon" status --json >/dev/null

          "$daemon" daemon uninstall
          test ! -e "$unit"
          "$daemon" status --json | jq -e '.registration.registered == false and .registration.reason == "not-registered"' >/dev/null
          echo 'Linux systemd-user lifecycle installed, reported health-v1, restarted, shut down, and uninstalled'

      # The counterpart to the parking step, and the reason any step above may leave the machine
      # in whatever state it fails in. `always()` because a failed probe is exactly when the
      # desktop most needs its own daemon back.
      - &linux-restore-registration
        name: Restore the installed Axon registration
        if: always()
        run: |
          set -euo pipefail
          # Set only by the parking step, and the reason this step may remove a registration at
          # all: without it the job never touched the desktop's own, and the unit sitting there is
          # that registration rather than a probe's leftover.
          if [ -z "${AXON_UNIT:-}" ]; then
            echo 'the registration was never parked; leaving the desktop alone'
            exit 0
          fi
          unit="$AXON_UNIT"
          daemon="$GITHUB_WORKSPACE/rust/target/debug/axon-linux"
          # Any registration or daemon still here belongs to the probes, because the desktop's own
          # were parked and stopped. Both have to go before the parked unit is put back, or the
          # restored service starts into a socket that is already taken. Best-effort: an end state
          # already reached looks the same as a command that had nothing to do.
          "$daemon" daemon uninstall >/dev/null 2>&1 || true
          "$daemon" shutdown >/dev/null 2>&1 || true
          rm -f "$unit"
          systemctl --user daemon-reload >/dev/null 2>&1 || true

          if [ -z "${AXON_PARKED:-}" ]; then
            echo 'no parked registration to restore'
            exit 0
          fi
          mkdir -p "$(dirname "$unit")"
          cp -p "$AXON_PARKED" "$unit"
          rm -f "$AXON_PARKED"
          systemctl --user daemon-reload
          # Not tolerated the way the parking side is: a restore that quietly does not happen
          # leaves the desktop without the daemon it had, and nobody finds out until the next run.
          if [ "${AXON_WAS_ENABLED:-false}" = true ] && ! systemctl --user enable axon.service; then
            echo '::error::the desktop Axon registration was restored but could not be re-enabled'
            exit 1
          fi
          echo 'restored the parked registration'

          if [ "${AXON_WAS_ACTIVE:-false}" != true ]; then
            exit 0
          fi
          if ! systemctl --user start axon.service; then
            echo '::error::the desktop Axon daemon was restored but did not start again'
            exit 1
          fi
          # `systemctl start` succeeding is not the daemon working, and this unit says so itself:
          # Type=simple means systemd calls it started at exec, which is before Axon can bind, so a
          # zero exit here covers a daemon that exec'd and died on a socket a probe never released.
          # Trusting it would be the same silent failure this job exists to close, one step further
          # out. Both halves are required: systemd's view alone is the exec claim above, and an
          # answer alone could come from a probe's orphan that bound while the socket was being
          # swept -- which is the case that leaves the restored unit dead on AddrInUse.
          answering=false
          for _ in {1..40}; do
            status="$("$daemon" status --json)"
            main_pid="$(systemctl --user show -p MainPID --value axon.service)"
            if [ "$(systemctl --user is-active axon.service || true)" = active ] \
              && printf '%s' "$status" | jq -e '.daemon.running' >/dev/null; then
              answering=true
              break
            fi
            sleep 0.25
          done
          if [[ "$answering" != true ]]; then
            # Both halves reported, because the two failures look nothing alike to whoever reads
            # this next: a unit that never came up, or a unit that is down while something else
            # answers on its endpoint.
            echo "::error::the desktop axon.service did not come back at $(printf '%s' "$status" | jq -r '.daemon.endpoint') -- unit is $(systemctl --user is-active axon.service || true), a daemon answering: $(printf '%s' "$status" | jq -r '.daemon.running'); this runner needs attention before the next live run"
            journalctl --user -u axon.service -n 20 --no-pager || true
            exit 1
          fi
          # Exact whenever the document allows it. A daemon this build can parse names its own
          # process, so requiring that to be systemd's is what rules out an orphan answering in the
          # restored service's place. `ready` and a mandatory pid are deliberately not required:
          # the desktop runs whichever release it installed, and a payload this build is too new to
          # parse reports a daemon that is up with no process id at all, where the pair above is
          # the most that can honestly be asserted.
          if printf '%s' "$status" | jq -e '.daemon.processId != null' >/dev/null \
            && ! printf '%s' "$status" | jq -e --argjson pid "$main_pid" '.daemon.processId == $pid' >/dev/null; then
            echo "::error::$(printf '%s' "$status" | jq -r '.daemon.endpoint') is answered by pid $(printf '%s' "$status" | jq -r '.daemon.processId'), not the restored axon.service (pid $main_pid)"
            journalctl --user -u axon.service -n 20 --no-pager || true
            exit 1
          fi
          echo 'the desktop Axon daemon is answering again'

  # The other half of Linux. The job above runs on GNOME Wayland and proves what that session
  # refuses; this one runs on bginf-sp2, GNOME 46 on Xorg (DGX OS forces nvidia-drm modeset=0, so
  # Wayland is unavailable there by design), and proves what the backend actually does on X11:
  # window capture without a portal, foreground keyboard delivery with proved activation, and the
  # XRecord recorder end to end. The two jobs share their park and restore steps and nothing else,
  # because every probe in between asserts the opposite fact on the other session.
  linux-x11:
    name: Linux X11 live loop
    runs-on: [self-hosted, axon-live-linux-x11]
    concurrency:
      group: axon-live-linux-x11
      cancel-in-progress: false
    timeout-minutes: 25
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      DISPLAY: ":0"
      # The runner is a systemd system unit outside the login session, so it inherits no X
      # credentials of its own. GDM writes the auto-login session's cookie here.
      XAUTHORITY: /run/user/1000/gdm/Xauthority
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build and probe dependencies
        run: |
          sudo apt-get update
          # xdotool is the input source that is not the daemon: the recording step needs input the
          # daemon's self-delivery ledger does not exclude, and every probe here reads which window
          # holds the foreground through it. x11-utils carries xdpyinfo.
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev clang xdotool x11-utils
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include -I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Build the daemon under test
        working-directory: rust
        run: cargo build --quiet --locked -p axon-linux

      - *linux-park-registration

      # A bench that sat idle has blanked and locked its screen (GNOME's defaults: idle after five
      # minutes, lock on blank), and a lock shield holds the foreground and swallows input -- every
      # probe below would fail in a way that looks like a delivery bug. So the job brings the
      # session to a known state itself rather than relying on settings someone made by hand, holds
      # it there for the job's length, and prints what it found before the first aimed action.
      - name: Wake the desktop and report its state
        run: |
          set -euo pipefail
          session="$(loginctl show-user "$(id -un)" -p Display --value)"
          if [ -z "$session" ]; then
            echo "::error::$(id -un) has no graphical login session; this bench auto-logs into GNOME on Xorg at boot"
            exit 1
          fi
          session_type="$(loginctl show-session "$session" -p Type --value)"
          if [ "$session_type" != x11 ]; then
            echo "::error::login session $session is '$session_type', not x11; this job proves the X11 backend and the Wayland job covers the rest"
            exit 1
          fi

          # logind lets a session's owner unlock it without authentication, and GNOME Shell drops
          # its shield when logind says so. Asked only when locked, so the log says which it was.
          if [ "$(loginctl show-session "$session" -p LockedHint --value)" = yes ]; then
            echo "session $session was locked; unlocking it"
            loginctl unlock-session "$session"
          fi
          xset dpms force on
          xset s reset
          # Held until the job ends -- the runner reaps the processes a job leaves -- and released
          # explicitly by the last step. An inhibitor rather than a settings change, so the bench's
          # own idle policy is untouched between runs.
          nohup gnome-session-inhibit --inhibit idle --reason 'Axon X11 live loop' sleep 1800 >/dev/null 2>&1 &
          echo "AXON_IDLE_INHIBITOR=$!" >> "$GITHUB_ENV"

          awake=false
          for _ in {1..40}; do
            if [ "$(loginctl show-session "$session" -p LockedHint --value)" = no ] \
              && gdbus call --session --dest org.gnome.ScreenSaver --object-path /org/gnome/ScreenSaver \
                   --method org.gnome.ScreenSaver.GetActive | grep -q false \
              && gdbus call --session --dest org.gnome.SessionManager --object-path /org/gnome/SessionManager \
                   --method org.gnome.SessionManager.IsInhibited 8 | grep -q true; then
              awake=true
              break
            fi
            sleep 0.25
          done
          if [[ "$awake" != true ]]; then
            echo "::error::session $session is still locked, blanked, or not idle-inhibited (LockedHint=$(loginctl show-session "$session" -p LockedHint --value))"
            exit 1
          fi

          # The X server, by name: RECORD is what the recorder observes through and XTEST is what
          # foreground delivery posts through.
          xdpyinfo > /tmp/axon-x11-xdpyinfo.txt
          for extension in RECORD XTEST; do
            grep -qw "$extension" /tmp/axon-x11-xdpyinfo.txt \
              || { echo "::error::the X server on $DISPLAY does not advertise $extension"; exit 1; }
          done

          # Asked of the registry rather than assumed. On Xorg the bus socket is display-suffixed
          # (at-spi/bus_0); a Wayland session names it at-spi/bus.
          address="$(gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress)"
          a11y_socket="$(printf '%s' "$address" | sed -n "s/.*unix:path=\([^,']*\).*/\1/p")"
          if [ -z "$a11y_socket" ] || [ ! -S "$a11y_socket" ]; then
            echo "::error::the accessibility bus is not up: org.a11y.Bus answered $address"
            exit 1
          fi
          if [ "$(gsettings get org.gnome.desktop.interface toolkit-accessibility)" != true ]; then
            echo '::error::toolkit-accessibility is off, so GTK applications will not publish themselves on the accessibility bus'
            exit 1
          fi

          # Printed, not asserted: what holds the foreground before anything is aimed, so a failure
          # further down can be read against the desktop it happened on. On this bench it is often
          # the DGX dashboard, a snap Firefox that is not on the accessibility bus.
          active="$(xdotool getactivewindow 2>/dev/null || true)"
          if [ -n "$active" ]; then
            echo "foreground: '$(xdotool getwindowname "$active" 2>/dev/null || true)' (pid $(xdotool getwindowpid "$active" 2>/dev/null || echo unknown))"
          else
            echo 'foreground: no active window'
          fi
          echo "session $session is x11, unlocked, awake, and idle-inhibited; accessibility bus at $a11y_socket"

      - name: Capture, resolve, act, and verify
        working-directory: rust
        run: |
          set -euo pipefail
          # Matched on the command line in either form it takes: `gnome-calculator` started from
          # PATH, as here, or by its full path, as the desktop launches it. Calculator is a
          # single-instance application, so a launch beside a running one hands its arguments to
          # that one and exits -- `--equation 0` would never reset the display this step reads.
          if pgrep -u "$(id -u)" -f '(^|/)gnome-calculator( |$)' >/dev/null; then
            echo '::error::GNOME Calculator is already running; refusing to alter an existing desktop session.'
            exit 1
          fi

          daemon=target/debug/axon-linux
          "$daemon" serve >/tmp/axon-linux-x11-daemon.log 2>&1 &
          daemon_pid=$!
          calculator_pid=""
          # Bounded: `wait` on a daemon that shutdown could not reach never returns, and the job
          # dies on the timeout instead of the real failure.
          cleanup() {
            "$daemon" shutdown >/dev/null 2>&1 || true
            for _ in {1..40}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -9 "$daemon_pid" >/dev/null 2>&1 || true
            # By the pid this step launched, and waited for rather than just signalled: the next
            # step refuses to start while a Calculator is running, and one still exiting from here
            # would read as somebody else's.
            if [ -n "$calculator_pid" ]; then
              kill "$calculator_pid" >/dev/null 2>&1 || true
              for _ in {1..40}; do
                if ! kill -0 "$calculator_pid" 2>/dev/null; then break; fi
                sleep 0.25
              done
              kill -9 "$calculator_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          ../scripts/assert-daemon-under-test "$daemon" "$daemon_pid" /tmp/axon-linux-x11-daemon.log

          gnome-calculator --equation 0 >/dev/null 2>&1 &
          calculator_pid=$!
          # Ready means the semantic tree and the pixels both: on X11 the screenshot is captured
          # straight from the window, so its absence here is a failure rather than a portal waiting
          # for authorization as it is under Wayland.
          ready=false
          for _ in {1..40}; do
            look="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator"}}}' | "$daemon" mcp)"
            if printf '%s' "$look" | jq -e '
              .result.isError == false
              and (.result.structuredContent.app.name | strings | length > 0)
              and .result.structuredContent.screenshotUnavailable == null
              and .result.structuredContent.screenshot.contentTransport == "mcp_image"
              and ([.result.structuredContent.app.windows[]?.root | .. | objects | select(.role == "text box" and .value? == "0")] | length == 1)
              and ([.result.structuredContent.app.windows[]?.root | .. | objects | select(.role == "button" and .label? == "1" and (.actions | index("Click")))] | length == 1)
            ' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done

          if [[ "$ready" != true ]]; then
            echo '::error::GNOME Calculator did not expose a screenshot, one display, and one named digit 1 button before the resolve deadline'
            printf '%s\n' "$look" | jq '{
              isError: .result.isError,
              error: (.result.structuredContent | {code, message}),
              app: (.result.structuredContent.app | {identifier, name}),
              screenshot: .result.structuredContent.screenshot,
              screenshotUnavailable: .result.structuredContent.screenshotUnavailable,
              targets: ([.result.structuredContent.app.windows[]?.root | .. | objects
                | select(.role? == "text box" or (.role? == "button" and .label? == "1"))
                | {role, label, value, name, identifier, actions}][0:20])
            }'
            exit 1
          fi

          # The window the screenshot should be of, measured by a different X client. GTK 4 draws
          # its own decorations and shadow, so the X window -- and the capture -- is larger than
          # the calculator face, and the two agree exactly.
          printf '%s' "$look" > /tmp/axon-linux-x11-look.json
          window="$(xdotool search --onlyvisible --pid "$calculator_pid" | head -n 1)"
          if [ -z "$window" ]; then
            echo "::error::GNOME Calculator (pid $calculator_pid) has no visible X window"
            exit 1
          fi
          eval "$(xdotool getwindowgeometry --shell "$window")"
          python3 -I ../scripts/assert-look-screenshot /tmp/axon-linux-x11-look.json "$WIDTH" "$HEIGHT"
          echo "GNOME Calculator captured over X11: a ${WIDTH}x${HEIGHT} PNG of its own window"

          retained_app="$(printf '%s' "$look" | jq -r '.result.structuredContent.app.name')"
          display_name="$(printf '%s' "$look" | jq -r '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "text box" and .value? == "0")][0].name')"
          retained_name="$(printf '%s' "$look" | jq -r '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "button" and .label? == "1" and (.actions | index("Click")))][0].name')"

          # Started before dispatch, so this proves a real transition rather than accepting a value
          # that was already present.
          jq -cn --arg app "$retained_app" --arg name "$display_name" '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"wait_for_value","arguments":{"target":{"app":$app,"name":$name},"equals":"01","timeoutMs":5000,"intervalMs":50}}}' \
            | "$daemon" mcp > /tmp/axon-linux-x11-wait-transition.json &
          wait_pid=$!
          sleep 0.1

          invoked="$(jq -cn --arg app "$retained_app" --arg name "$retained_name" '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"invoke","arguments":{"target":{"app":$app,"name":$name},"name":"Click"}}}' | "$daemon" mcp)"
          if ! printf '%s' "$invoked" | jq -e '.result.isError == false and .result.structuredContent.dispatch.success == true and .result.structuredContent.resolution.status == "unique"' >/dev/null; then
            echo '::error::GNOME Calculator digit 1 semantic name did not resolve uniquely and dispatch'
            printf '%s\n' "$invoked" | jq .
            exit 1
          fi

          wait "$wait_pid"
          transitioned="$(cat /tmp/axon-linux-x11-wait-transition.json)"
          if ! printf '%s' "$transitioned" | jq -e '.result.isError == false and .result.structuredContent.wait.success == true and .result.structuredContent.wait.status == "satisfied" and .result.structuredContent.wait.matched.value == "01"' >/dev/null; then
            echo '::error::wait_for_value did not observe the GNOME Calculator display transition from 0 to 01'
            printf '%s\n' "$transitioned" | jq .
            exit 1
          fi
          echo 'Linux on X11 captured, resolved, invoked, and observed a real value transition'

      # The rung the Wayland job proves must stay dark, lit. `keyboard` aimed at Calculator has no
      # semantic rung and no background one either -- GTK 4 acts on no window-targeted event -- so
      # the only way the digit reaches the display is the foreground: activate Calculator, prove it
      # is frontmost, post through XTEST, and hand the foreground back.
      - name: Deliver global input on X11
        working-directory: rust
        run: |
          set -euo pipefail
          if pgrep -u "$(id -u)" -f '(^|/)gnome-calculator( |$)' >/dev/null; then
            echo '::error::GNOME Calculator is already running; refusing to alter an existing desktop session.'
            exit 1
          fi

          daemon=target/debug/axon-linux
          "$daemon" serve >/tmp/axon-linux-x11-input.log 2>&1 &
          daemon_pid=$!
          calculator_pid=""
          holder_pid=""
          cleanup() {
            "$daemon" shutdown >/dev/null 2>&1 || true
            for _ in {1..40}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -9 "$daemon_pid" >/dev/null 2>&1 || true
            for pid in "$calculator_pid" "$holder_pid"; do
              if [ -z "$pid" ]; then continue; fi
              kill "$pid" >/dev/null 2>&1 || true
              for _ in {1..40}; do
                if ! kill -0 "$pid" 2>/dev/null; then break; fi
                sleep 0.25
              done
              kill -9 "$pid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          ../scripts/assert-daemon-under-test "$daemon" "$daemon_pid" /tmp/axon-linux-x11-input.log

          # The same census the Wayland job asserts unusable, usable here -- read from the daemon
          # that is about to act, so the published document and the dispatch cannot disagree.
          health="$("$daemon" status --json)"
          printf '%s' "$health" | jq -c '{session, capabilities: [.capabilities[] | select(.capability | IN("observeGlobalInput", "hitTest", "pointerInput", "keyboardInput", "screenshot")) | {capability, usable, reason}]}'
          for capability in observeGlobalInput hitTest pointerInput keyboardInput screenshot; do
            printf '%s' "$health" | jq -e --arg c "$capability" '[.capabilities[] | select(.capability == $c)] | length == 1 and .[0].usable == true' >/dev/null \
              || { echo "::error::$capability is not usable in this X11 session"; exit 1; }
          done

          gnome-calculator --equation 0 >/dev/null 2>&1 &
          calculator_pid=$!
          # The foreground holder. Activation has to be proved from somewhere for the claim to mean
          # anything, and it has to be somewhere on the accessibility bus: the daemon refuses to take
          # the foreground from a window it could not name and so could not give back.
          ../scripts/linux-probe-window >/tmp/axon-probe-window.log 2>&1 &
          holder_pid=$!

          mcp() { printf '%s\n' "$1" | "$daemon" mcp; }
          display_value() {
            mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator","screenshot":false}}}' \
              | jq -r '[.result.structuredContent.app.windows[]?.root | .. | objects | select(.role == "text box" and (.value? // "") != "")][0].value // ""'
          }
          ready=false
          for _ in {1..40}; do
            holder="$(mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"axon-probe-window","screenshot":false}}}')"
            if [ "$(display_value)" = 0 ] && printf '%s' "$holder" | jq -e '.result.isError == false' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            echo '::error::GNOME Calculator and the probe window did not both reach the accessibility bus'
            cat /tmp/axon-probe-window.log
            exit 1
          fi
          calculator="$(mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator","screenshot":false}}}')"
          retained_app="$(printf '%s' "$calculator" | jq -r '.result.structuredContent.app.name')"
          display_name="$(printf '%s' "$calculator" | jq -r '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "text box" and .value? == "0")][0].name')"

          # Bounded: `--sync` waits for the window manager to comply and never gives up on its own.
          timeout 10 xdotool search --name 'Axon Probe Window' windowactivate --sync >/dev/null 2>&1 || true
          foreground="$(xdotool getactivewindow getwindowname 2>/dev/null || echo '<none>')"
          echo "foreground before the first aimed action: '$foreground'"
          if [ "$foreground" != 'Axon Probe Window' ]; then
            echo '::error::the probe window could not be brought to the foreground, so activation would not be proved from a known window'
            exit 1
          fi

          # Without the opt-in this is a refusal, and a precise one: the background rung is named
          # and refused for the toolkit it was measured against, and nothing reaches the display.
          refused="$(jq -cn --arg app "$retained_app" '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"keyboard","arguments":{"app":$app,"text":"7","deliveryPolicy":"backgroundOnly"}}}' | "$daemon" mcp)"
          if ! printf '%s' "$refused" | jq -e '
            .result.isError == false
            and .result.structuredContent.dispatchSuccess == false
            and .result.structuredContent.delivery == null
            and .result.structuredContent.refusal.reason == "foregroundNotPermitted"
            and .result.structuredContent.refusal.requiredRung == "foreground"
            and any(.result.structuredContent.refusal.alsoRefused[]; .rung == "pixel" and .reason == "backgroundPixelUnsupported" and (.message | test("GTK 4")))
          ' >/dev/null; then
            echo '::error::keyboard under backgroundOnly was not refused as foreground-only with the GTK 4 pixel refusal named'
            printf '%s\n' "$refused" | jq .
            exit 1
          fi
          sleep 0.3
          test "$(display_value)" = 0
          echo 'keyboard under backgroundOnly refused, naming the foreground rung it needs and the GTK 4 pixel rung it cannot have'

          jq -cn --arg app "$retained_app" --arg name "$display_name" '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"wait_for_value","arguments":{"target":{"app":$app,"name":$name},"equals":"07","timeoutMs":5000,"intervalMs":50}}}' \
            | "$daemon" mcp > /tmp/axon-linux-x11-keyboard-wait.json &
          wait_pid=$!
          sleep 0.1

          delivered="$(jq -cn --arg app "$retained_app" '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"keyboard","arguments":{"app":$app,"text":"7","deliveryPolicy":"foregroundPermitted"}}}' | "$daemon" mcp)"
          printf '%s' "$delivered" | jq -c '.result.structuredContent | {delivery, dispatchSuccess, dispatch, foreground}'
          # Activation is proved from the probe window, not assumed from a Calculator that happened
          # to be in front. Restoration is cleanup evidence rather than a success condition of the
          # rung, but on this bench the prior window is on the bus and so can always be named and
          # given back; a false here is a regression in the hand-back, and the lane says so.
          if ! printf '%s' "$delivered" | jq -e '
            .result.isError == false
            and .result.structuredContent.delivery == "foreground"
            and .result.structuredContent.dispatchSuccess == true
            and .result.structuredContent.dispatch.mechanism == "XTest keyboard"
            and .result.structuredContent.foreground.activationProved == true
            and .result.structuredContent.foreground.alreadyFrontmost == false
            and .result.structuredContent.foreground.restored == true
          ' >/dev/null; then
            echo '::error::keyboard under foregroundPermitted did not deliver through the foreground rung with proved activation and restoration'
            printf '%s\n' "$delivered" | jq .
            exit 1
          fi

          wait "$wait_pid"
          transitioned="$(cat /tmp/axon-linux-x11-keyboard-wait.json)"
          if ! printf '%s' "$transitioned" | jq -e '.result.isError == false and .result.structuredContent.wait.success == true and .result.structuredContent.wait.status == "satisfied" and .result.structuredContent.wait.matched.value == "07"' >/dev/null; then
            echo '::error::the GNOME Calculator display did not change from 0 to 07 after the foreground keystroke'
            printf '%s\n' "$transitioned" | jq .
            exit 1
          fi
          after="$(xdotool getactivewindow getwindowname 2>/dev/null || echo '<none>')"
          if [ "$after" != 'Axon Probe Window' ]; then
            echo "::error::the daemon reported the foreground restored, but '$after' holds it, not the probe window"
            exit 1
          fi
          echo 'Linux on X11 activated GNOME Calculator from the probe window, delivered 7 through XTEST, read 0 -> 07 back, and handed the foreground back'

      # The recorder, end to end, with input from a separate process (xdotool) because the daemon
      # deliberately keeps its own delivery out of what it records -- which the probe then proves
      # too. The probe owns its daemon, its target window, and its cleanup; its header says why
      # each assertion is shaped the way it is.
      - name: Record, replay, and save on X11
        working-directory: rust
        run: ../scripts/linux-recording-probe --daemon "$PWD/target/debug/axon-linux" --target gtk3

      - name: Install, report status, shut down, and uninstall
        working-directory: rust
        run: |
          set -euo pipefail
          unit="$HOME/.config/systemd/user/axon.service"
          daemon="$PWD/target/debug/axon-linux"

          expected_version="$(cat ../VERSION)"
          test "$("$daemon" version)" = "$expected_version"

          "$daemon" daemon install
          test "$(systemctl --user is-enabled axon.service)" = enabled

          # Read together on purpose: an `on-failure` restart landing between the two would fail
          # the pid assertion over a restart rather than over the thing being tested.
          status="$("$daemon" status --json)"
          main_pid="$(systemctl --user show -p MainPID --value axon.service)"
          printf '%s' "$status" | jq -e '.schemaVersion == "health-v1"' >/dev/null
          printf '%s' "$status" | jq -e --arg v "$expected_version" '.version == $v' >/dev/null
          printf '%s' "$status" | jq -e '.platform == "linux"' >/dev/null
          printf '%s' "$status" | jq -e '.daemon.running and .daemon.ready' >/dev/null
          printf '%s' "$status" | jq -e '.session.interactive and .session.graphical and .session.detail == "x11"' >/dev/null
          printf '%s' "$status" | jq -e --arg p "$daemon" '.registration.registered and .registration.path == $p' >/dev/null
          printf '%s' "$status" | jq -e --argjson pid "$main_pid" '.daemon.processId == $pid' >/dev/null
          printf '%s' "$status" | jq -e '.capabilities | length == 15' >/dev/null
          printf '%s' "$status" | jq -e '[.capabilities[] | select(.usable == false and (.reason // "") == "")] | length == 0' >/dev/null
          # The installed service sees the same session the probes did: on X11 nothing withdraws
          # synthetic input, capture, hit testing, or observation, and the document must say so
          # rather than carry the Wayland job's refusals.
          for capability in pointerInput keyboardInput screenshot hitTest observeGlobalInput; do
            printf '%s' "$status" | jq -e --arg c "$capability" '[.capabilities[] | select(.capability == $c)][0] | .usable == true' >/dev/null \
              || { echo "::error::the installed service reports $capability unusable on X11"; printf '%s\n' "$status" | jq '.capabilities'; exit 1; }
          done
          printf '%s' "$status" | jq -e '.session.accessibilityEnabled == true' >/dev/null

          "$daemon" daemon restart
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{}}}' \
            | "$daemon" mcp | jq -e '.result.isError == false' >/dev/null

          "$daemon" shutdown
          "$daemon" status --json | jq -e '.daemon.running == false and .registration.registered == true' >/dev/null
          "$daemon" status --json >/dev/null

          "$daemon" daemon uninstall
          test ! -e "$unit"
          "$daemon" status --json | jq -e '.registration.registered == false and .registration.reason == "not-registered"' >/dev/null
          echo 'Linux on X11: systemd-user lifecycle installed, reported health-v1 with input, capture, hit testing, and observation usable, restarted, shut down, and uninstalled'

      - *linux-restore-registration

      - name: Release the idle inhibitor
        if: always()
        run: |
          if [ -n "${AXON_IDLE_INHIBITOR:-}" ]; then
            kill "$AXON_IDLE_INHIBITOR" >/dev/null 2>&1 || true
            echo 'released the idle inhibitor; the bench returns to its own idle policy'
          fi

  windows:
    name: Windows live loop
    runs-on: [self-hosted, axon-live-windows]
    concurrency:
      group: axon-live-windows
      cancel-in-progress: false
    # Room for the restore's retry budget. It can spend several minutes starting this desktop's
    # registration on a machine under transient load, and a job cancelled mid-restore is a desktop
    # left without its own daemon for the rest of the login session.
    timeout-minutes: 30
    steps:
      # Before checkout, and the only stage that cannot go through the relay: a leaked daemon holds
      # its image file open, which is what breaks the checkout that would deliver the probe script
      # (AXN-38). It is a second implementation of the probe script's own sweep for that reason
      # alone, and carries the same refusal, because sweeping by path on a machine whose own
      # registration points into one of these directories would stop the desktop's daemon and call
      # it a leftover.
      - name: Remove leaked live-probe daemons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceRoot = 'C:\actions-runner-axon\_work\'
          $liveRoot = 'C:\ProgramData\Axon\live\'

          # The runner service is NETWORK SERVICE and the task belongs to the desktop user, so it
          # may not be readable from here. An unreadable registration is reported and tolerated:
          # the probe script's own guard runs as that user and refuses there.
          $desktopTask = Get-ScheduledTask -TaskName 'Axon Windows Daemon' -ErrorAction SilentlyContinue
          if ($null -eq $desktopTask) {
            Write-Output 'this runner has no Axon Windows Daemon registration visible from the runner service'
          }
          else {
            $registered = (@($desktopTask.Actions)[0].Execute ?? '').Trim().Trim('"')
            foreach ($root in @($workspaceRoot, $liveRoot)) {
              if ($registered.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Axon Windows Daemon is registered at $registered, inside this lane's own $root; an earlier run repointed this desktop's start-at-login registration and it must be reinstalled from its permanent path before this lane can run again"
              }
            }
          }

          function Get-LiveProbeDaemons {
            @(Get-CimInstance Win32_Process -Filter "Name = 'axon-win.exe' OR Name = 'axon-win-daemon.exe'" |
              Where-Object {
                $path = $_.ExecutablePath
                $null -ne $path -and (
                  $path.StartsWith($workspaceRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                  $path.StartsWith($liveRoot, [System.StringComparison]::OrdinalIgnoreCase)
                )
              })
          }

          foreach ($attempt in 1..3) {
            foreach ($process in Get-LiveProbeDaemons) {
              Write-Output "Stopping leaked live-probe daemon pid=$($process.ProcessId) path=$($process.ExecutablePath)"
              try { Stop-Process -Id $process.ProcessId -Force -ErrorAction Stop }
              catch { Write-Warning "Could not stop pid=$($process.ProcessId) on attempt ${attempt}: $_" }
            }
            if ((Get-LiveProbeDaemons).Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          }
          $remaining = Get-LiveProbeDaemons
          if ($remaining.Count -ne 0) {
            throw "Scoped live-probe daemons remain: $($remaining.ExecutablePath -join ', ')"
          }

      - name: Check out Axon
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Each stage is one call across the forced-command relay into the desktop user's session, and
      # they are separate steps for the same reason the Linux and macOS jobs are: a job that dies
      # after the park still owes this desktop its daemon, and a `finally` block inside a single
      # remote call cannot pay that debt, because a cancelled job kills the `ssh` client and the
      # remote shell with it. What each stage does is documented in the probe script itself.

      # Built, copied outside the workspace, and proved runnable before anything on this desktop is
      # touched. The first execution of a never-seen binary is where Defender's block-at-first-sight
      # is paid, and paying it here is what makes a quarantine cost nothing: this machine still has
      # its own daemon at that point.
      - name: Build the daemon under test
        shell: pwsh
        run: .github\scripts\invoke-windows-live-stage.ps1 -Stage build

      # A live runner is also somebody's desktop, so a daemon already serving the pipe is the normal
      # case rather than a reason to refuse. It is stopped once for the whole job, because the probe
      # starts its own daemon and can only be evidence about this build if that daemon is the one
      # answering. This stage reads the desktop's registration and never writes it: the only thing
      # borrowed is the pipe, and the restore below pays it back.
      - name: Park the desktop's Axon daemon
        shell: pwsh
        run: .github\scripts\invoke-windows-live-stage.ps1 -Stage park

      - name: Serve the interactive desktop and inspect a real window
        shell: pwsh
        run: .github\scripts\invoke-windows-live-stage.ps1 -Stage probe

      # The counterpart to the parking step, and the reason the probe above may leave the machine in
      # whatever state it failed in. `always()` because a failed probe is exactly when this desktop
      # most needs its own daemon back.
      #
      # The condition asks only whether the probe script is on disk, deliberately. Whether this
      # machine is owed a daemon is a fact about the machine, recorded there, and the restore stage
      # reads it -- so a job-scoped sentinel here could only subtract from that answer. It would
      # subtract in exactly the case the machine-side record exists for: a debt left by a run whose
      # restore failed or whose runner died is paid by the next job that gets this far, and that job
      # may well be one that never reached its own park because the build stage failed.
      - name: Restore the desktop's Axon daemon
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh
        run: .github\scripts\invoke-windows-live-stage.ps1 -Stage restore
