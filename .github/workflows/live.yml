name: Live desktop verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS live loop
    runs-on: [self-hosted, axon-live-mac]
    concurrency:
      group: axon-live-mac
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      # The label `LaunchAgentConfiguration` registers by, in
      # `Sources/AxonCore/LaunchAgentManager.swift`. Named once here because the parking and restore
      # steps address the agent through `launchctl` directly, which the CLI cannot do for them: the
      # question they ask is whether the agent is loaded, and no Axon subcommand reports that.
      AXON_LAUNCH_AGENT_LABEL: dev.axon.daemon
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unlock signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.BGLAB_MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo '::error::BGLAB_MAC_KEYCHAIN_PASSWORD secret is not set'; exit 1
          fi
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db

      - name: Build the signed app
        env:
          AXON_CODESIGN_IDENTITY: 2A1FE6185D48E55E22FA9DB390B452D2E06AD665
        run: ./scripts/package-app

      # A live runner is also somebody's desktop, so an Axon daemon already serving the endpoint is
      # the normal case rather than a reason to refuse. It is stopped once for the whole job rather
      # than from inside the probe, because the probe launches its own daemon and can only be
      # evidence about this build if that daemon is the one answering. The last step puts it back.
      - name: Park the installed Axon daemon
        run: |
          set -euo pipefail
          cli="$PWD/dist/Axon.app/Contents/Resources/bin/axon"

          # Whether start-at-login was live when the job arrived, which is the only fact that says
          # whether the restore owes this machine a daemon. The plist cannot answer it: `shutdown`
          # boots the agent out and deliberately leaves the registration on disk, so a machine this
          # job unloaded still reads as registered. `launchctl print` exits non-zero for a label
          # that is not loaded in the domain.
          agent_was_loaded=false
          if launchctl print "gui/$(id -u)/$AXON_LAUNCH_AGENT_LABEL" >/dev/null 2>&1; then
            agent_was_loaded=true
          fi
          # A daemon can also come from a running Axon.app, which launchd does not own and which
          # `daemon restart` would not bring back. Recorded separately because it is put back
          # differently, and matched by process name because the app serves from its own process
          # rather than through a `serve` child.
          app_was_running=false
          if pgrep -x Axon >/dev/null; then
            app_was_running=true
          fi
          # Handed to the restore step before anything is stopped, so a machine the stop below
          # fails on still gets its daemon back.
          {
            echo "AXON_AGENT_WAS_LOADED=$agent_was_loaded"
            echo "AXON_APP_WAS_RUNNING=$app_was_running"
          } >> "$GITHUB_ENV"
          echo "found this desktop as: LaunchAgent loaded=$agent_was_loaded, Axon.app running=$app_was_running"

          # The build under test does the stopping, and deliberately not the installed
          # `/opt/homebrew/bin/axon`: a runner's installed CLI is whichever release it last
          # installed, so a verb that release predates fails there, and `|| true` swallows it. That
          # is not hypothetical -- the macOS runner's installed binary had no `shutdown` at all,
          # which made this whole protection a no-op that nothing reported.
          #
          # Untolerated for the same reason. `shutdown` boots the agent out before asking the
          # daemon to exit, so `KeepAlive` cannot relaunch it in the gap, and it exits non-zero
          # while anything is still answering -- which makes its success the endpoint-is-free
          # guarantee the probe depends on. A daemon left holding the endpoint would answer every
          # assertion below.
          "$cli" shutdown

      - name: Capture, resolve, act, and verify
        run: |
          set -euo pipefail
          cli="$PWD/dist/Axon.app/Contents/Resources/bin/axon"
          app_executable="$PWD/dist/Axon.app/Contents/MacOS/Axon"

          if pgrep -x Calculator >/dev/null; then
            echo '::error::Calculator is already running; refusing to alter an existing desktop session.'
            exit 1
          fi
          # Calculator alone. The daemon this step launches and the desktop's own belong to the
          # restore step, so that they are handled even when this step dies before its trap is
          # armed, and so that a failure here is diagnosed against a machine that still looks the
          # way it failed.
          trap 'killall Calculator >/dev/null 2>&1 || true' EXIT

          # `open -n` launches the bundle, and the app serves the endpoint from inside its own
          # process -- there is no `serve` child to wait on -- so the app process is the daemon
          # under test and its pid is what ties the document below to this build. `open` reports no
          # pid, so it is found by the bundle executable's path, which no other install on the
          # machine shares. Exactly one match is required: a second would be a leftover from an
          # earlier run, and choosing between them would be a guess.
          open -n "$PWD/dist/Axon.app"
          app_pid=""
          for _ in {1..40}; do
            app_pid="$(pgrep -f "$app_executable" || true)"
            if [[ -n "$app_pid" ]]; then
              break
            fi
            sleep 0.25
          done
          if [[ -z "$app_pid" ]]; then
            echo "::error::nothing is running $app_executable; the app under test never launched"
            exit 1
          fi
          if [[ "$(printf '%s\n' "$app_pid" | wc -l | tr -d '[:space:]')" != 1 ]]; then
            echo "::error::$app_executable is running as pids $(printf '%s' "$app_pid" | tr '\n' ' '); an earlier run left one behind, and which of them answers the endpoint is a guess"
            exit 1
          fi

          # Everything below is a client of the endpoint, so this is what makes the document
          # evidence about the app this step launched rather than about whichever daemon is
          # listening. Parking the installed one narrows that window but cannot close it: the
          # version comparison below cannot tell this build from an installed daemon reporting the
          # same version, and this runner's install is built from this repository.
          scripts/assert-daemon-under-test "$cli" "$app_pid"

          # The published contract, checked against a real logged-in Mac.
          expected_version="$(cat VERSION)"
          # A local binary invocation, so a statement about the checkout rather than about the
          # daemon. The document's own `.version` below is the daemon's claim, and the pid
          # assertion is what makes that claim about this build.
          test "$("$cli" version)" = "$expected_version"
          status="$("$cli" status --json)"
          printf '%s' "$status" | jq -e '.schemaVersion == "health-v1"' >/dev/null
          # Re-asserted on this document rather than inherited from the check above, so that every
          # claim read out of it describes the one process the pid names.
          printf '%s' "$status" | jq -e --argjson pid "$app_pid" '.daemon.processId == $pid' >/dev/null
          printf '%s' "$status" | jq -e --arg v "$expected_version" '.version == $v' >/dev/null
          printf '%s' "$status" | jq -e '.platform == "macos"' >/dev/null
          printf '%s' "$status" | jq -e '.daemon.running and .daemon.ready' >/dev/null
          printf '%s' "$status" | jq -e '.session.interactive and .session.graphical' >/dev/null
          # The complete vocabulary, every unusable entry explained.
          printf '%s' "$status" | jq -e '.capabilities | length == 15' >/dev/null
          printf '%s' "$status" | jq -e '[.capabilities[] | select(.usable == false and (.reason // "") == "")] | length == 0' >/dev/null
          printf '%s' "$status" | jq -e '[.permissions[] | select(.name == "accessibility")][0].granted == true' >/dev/null
          echo 'Axon daemon is ready and Accessibility is granted'

          open -a Calculator
          clear_locator='{"role":"AXButton","description":"All Clear","actions":["AXPress"]}'
          clear_result=""
          for _ in {1..40}; do
            clear_result="$("$cli" find Calculator "$clear_locator")"
            if printf '%s' "$clear_result" | jq -e '.result.resolution.best != null' >/dev/null; then
              break
            fi
            sleep 0.25
          done
          clear_handle="$(printf '%s' "$clear_result" | jq -er '.result.resolution.best.handle')"
          echo 'Calculator All Clear button is resolvable'

          "$cli" invoke "$clear_handle" AXPress | jq -e '.result.action.success == true' >/dev/null
          echo 'Calculator All Clear button pressed'

          one_result="$("$cli" find Calculator '{"role":"AXButton","description":"1","actions":["AXPress"]}')"
          one_handle="$(printf '%s' "$one_result" | jq -er '.result.resolution.best.handle')"
          "$cli" invoke "$one_handle" AXPress | jq -e '.result.action.success == true' >/dev/null
          echo 'Calculator digit 1 pressed'

          "$cli" look Calculator --json \
            | jq -e '.indexedNodes | any(.role == "AXStaticText" and (.value | strings | contains("1")))'
          echo 'Calculator display verified'

      # The counterpart to the parking step, and the reason the probe above may leave the machine
      # in whatever state it failed in. `always()` because a failed probe is exactly when the
      # desktop most needs its own daemon back.
      #
      # It needs a step of its own rather than a trap because `shutdown` is not a pause: it boots
      # the LaunchAgent out so `KeepAlive` cannot relaunch the daemon mid-request, and the agent
      # then stays unloaded for the rest of the login session. A job that calls it owes this
      # machine a bootstrap, and a trap inside a step that the runner cancels never runs.
      - name: Restore the installed Axon daemon
        if: always()
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/dist/Axon.app/Contents/Resources/bin/axon"

          # Set only by the parking step, and the reason this step may stop a daemon at all:
          # without it the job never touched this desktop, and anything serving here is its own.
          if [ -z "${AXON_AGENT_WAS_LOADED:-}" ]; then
            echo 'the installed daemon was never parked; leaving the desktop alone'
            exit 0
          fi

          # Anything still serving is the probe's, because the desktop's own was stopped at the top
          # of the job. It has to go before the agent is bootstrapped back, or the restored daemon
          # starts into an endpoint that is already taken. Best-effort here alone: the probe's app
          # may have exited already, and `shutdown` finding nothing to stop looks the same.
          "$cli" shutdown >/dev/null 2>&1 || true
          killall Calculator >/dev/null 2>&1 || true

          if [ "$AXON_AGENT_WAS_LOADED" = true ]; then
            # `daemon restart`, never `daemon install`: restart bootstraps the plist that is on
            # disk without rewriting it, while install would repoint the desktop's registration at
            # the invoking binary -- here a `dist` directory the next run overwrites. The build
            # under test asks, because the installed CLI is whichever release this desktop last
            # installed and need not carry the verb at all.
            if ! "$cli" daemon restart; then
              echo "::error::this job booted the desktop's Axon LaunchAgent out and could not bootstrap it back; this runner has no start-at-login daemon until someone logs in again"
              exit 1
            fi
          elif [ "${AXON_APP_WAS_RUNNING:-false}" = true ]; then
            open -a /Applications/Axon.app
          else
            echo 'this desktop had no Axon daemon when the job arrived; leaving it stopped'
            exit 0
          fi

          # Neither `daemon restart` nor `open` is trusted on its exit code: both report on
          # starting a daemon, not on one serving, and `launchctl bootstrap` returning zero is a
          # claim about loading a job. Read together on purpose, so the pair below describes one
          # moment rather than two.
          answering=false
          status=""
          agent_pid=""
          for _ in {1..40}; do
            status="$("$cli" status --json)"
            agent_pid="$(launchctl print "gui/$(id -u)/$AXON_LAUNCH_AGENT_LABEL" 2>/dev/null | awk '/^[[:space:]]*pid = / { print $3; exit }')"
            if printf '%s' "$status" | jq -e '.daemon.running' >/dev/null; then
              answering=true
              break
            fi
            sleep 0.25
          done
          if [[ "$answering" != true ]]; then
            echo "::error::the desktop Axon daemon did not come back at $(printf '%s' "$status" | jq -r '.daemon.endpoint'); this runner needs attention before the next live run"
            launchctl print "gui/$(id -u)/$AXON_LAUNCH_AGENT_LABEL" 2>&1 | head -20 || true
            tail -20 "$HOME/Library/Logs/Axon/daemon.err.log" 2>/dev/null || true
            exit 1
          fi

          if [ "$AXON_AGENT_WAS_LOADED" = true ]; then
            # A daemon answering is not the agent running. Both halves are required, because the
            # two failures look nothing alike to whoever reads this next: an agent that never came
            # back, or an agent that is unloaded while something else answers on its endpoint --
            # which is the case that leaves the next bootstrap dead on an address already in use.
            if [ -z "$agent_pid" ]; then
              echo "::error::a daemon is answering at $(printf '%s' "$status" | jq -r '.daemon.endpoint') but launchd is not running $AXON_LAUNCH_AGENT_LABEL; this desktop's start-at-login registration is still booted out"
              exit 1
            fi
            # Exact whenever the document allows it. A daemon this build can parse names its own
            # process, so requiring that to be launchd's is what rules out one of the probe's
            # orphans answering in the restored daemon's place. A missing pid is tolerated rather
            # than required: this desktop runs whichever release it installed, and a payload this
            # build is too new to parse reports a daemon that is up with no process id at all.
            if printf '%s' "$status" | jq -e '.daemon.processId != null' >/dev/null \
              && ! printf '%s' "$status" | jq -e --argjson pid "$agent_pid" '.daemon.processId == $pid' >/dev/null; then
              echo "::error::$(printf '%s' "$status" | jq -r '.daemon.endpoint') is answered by pid $(printf '%s' "$status" | jq -r '.daemon.processId'), not the restored LaunchAgent (pid $agent_pid)"
              exit 1
            fi
          fi
          echo 'the desktop Axon daemon is answering again'

  linux:
    name: Linux live loop
    runs-on: [self-hosted, axon-live-linux]
    concurrency:
      group: axon-live-linux
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      DISPLAY: ":0"
      WAYLAND_DISPLAY: wayland-0
    steps:
      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Built once and named as its own step rather than as a side effect of the first probe,
      # because every step below runs this binary and each one is a claim about it.
      - name: Build the daemon under test
        working-directory: rust
        run: cargo build --quiet --locked -p axon-linux

      # A live runner is also somebody's desktop, so an Axon registration already being present --
      # installed, enabled, and serving the socket -- is the normal case rather than a reason to
      # refuse. It is parked once for the whole job rather than once per step, because every probe
      # below starts its own daemon and can only be evidence about this build if that daemon is
      # the one answering. The last step puts the registration back exactly as it was found.
      - name: Park the installed Axon registration
        working-directory: rust
        run: |
          set -euo pipefail
          unit="$HOME/.config/systemd/user/axon.service"
          parked=""
          was_enabled=false
          was_active=false
          if [ -e "$unit" ]; then
            if systemctl --user is-enabled axon.service >/dev/null 2>&1; then was_enabled=true; fi
            if systemctl --user is-active axon.service >/dev/null 2>&1; then was_active=true; fi
            parked="$(mktemp)"
            cp -p "$unit" "$parked"
            systemctl --user stop axon.service >/dev/null 2>&1 || true
            systemctl --user disable axon.service >/dev/null 2>&1 || true
            rm -f "$unit"
            systemctl --user daemon-reload >/dev/null 2>&1 || true
            echo "parked the existing registration (enabled=$was_enabled active=$was_active)"
          else
            echo 'no existing registration to park'
          fi
          # Handed to the restore step before the socket is checked, so a machine this step
          # refuses to run on still gets its registration back.
          {
            echo "AXON_UNIT=$unit"
            echo "AXON_PARKED=$parked"
            echo "AXON_WAS_ENABLED=$was_enabled"
            echo "AXON_WAS_ACTIVE=$was_active"
          } >> "$GITHUB_ENV"

          # Removing the registration is not the same as freeing the socket, and stopping the
          # service is asynchronous. Anything still answering here would answer the probes too, so
          # this names it rather than killing a process the job has no way to put back.
          daemon=target/debug/axon-linux
          status=""
          free=false
          for _ in {1..40}; do
            status="$("$daemon" status --json)"
            if printf '%s' "$status" | jq -e '.daemon.running == false' >/dev/null; then
              free=true
              break
            fi
            sleep 0.25
          done
          if [[ "$free" != true ]]; then
            echo "::error::$(printf '%s' "$status" | jq -r '.daemon.endpoint') is still served by pid $(printf '%s' "$status" | jq -r '.daemon.processId // "unknown"') after the registration was parked; nothing below could be evidence about this build while it holds the socket"
            exit 1
          fi
          # Says what it checked. `serve` refuses on a successful connect to the endpoint, which is
          # a narrower question than whether anything answered a health request -- something bound
          # but mute reads as absent here. That case is not lost, it just fails one step later and
          # by name, when the probe's own daemon cannot bind.
          echo 'no daemon is answering on the Axon socket'

      - name: Capture, resolve, act, and verify
        working-directory: rust
        run: |
          set -euo pipefail
          test -S /run/user/1000/at-spi/bus

          if pgrep -u "$(id -u)" -f '[/]usr/bin/gnome-calculator' >/dev/null; then
            echo '::error::GNOME Calculator is already running; refusing to alter an existing desktop session.'
            exit 1
          fi

          daemon=target/debug/axon-linux
          "$daemon" serve >/tmp/axon-linux-daemon.log 2>&1 &
          daemon_pid=$!
          # Bounded for the same reason as the Wayland step: `wait` on a daemon that shutdown could
          # not reach never returns, and the job dies on the timeout instead of the real failure.
          cleanup() {
            "$daemon" shutdown >/dev/null 2>&1 || true
            for _ in {1..40}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -9 "$daemon_pid" >/dev/null 2>&1 || true
            pkill -u "$(id -u)" -f '[/]usr/bin/gnome-calculator' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Everything below is a client of the socket, so this is what makes it evidence about
          # the daemon this step started rather than about whichever one is listening.
          ../scripts/assert-daemon-under-test "$daemon" "$daemon_pid" /tmp/axon-linux-daemon.log

          gnome-calculator --equation 0 >/dev/null 2>&1 &
          for _ in {1..40}; do
            look="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator"}}}' | "$daemon" mcp)"
            if printf '%s' "$look" | jq -e '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "text box" and .value? == "0")] | length == 1' >/dev/null; then break; fi
            sleep 0.25
          done

          printf '%s' "$look" | jq -e '.result.structuredContent.app.windows[0].root' >/dev/null
          display_object="$(printf '%s' "$look" | jq -er '[.result.structuredContent.app.windows[].root | .. | objects | select(.role == "text box" and .value? == "0")][0].identifier')"

          found="$(printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"find","arguments":{"target":{"app":"Calculator","locator":{"label":"1","actions":["Click"]}}}}}' | "$daemon" mcp)"
          handle="$(printf '%s' "$found" | jq -er '.result.structuredContent.handle')"
          invoked="$(jq -cn --arg handle "$handle" '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"invoke","arguments":{"target":$handle,"name":"Click"}}}' | "$daemon" mcp)"
          printf '%s' "$invoked" | jq -e '.result.structuredContent.dispatch.success == true' >/dev/null

          verified=false
          for _ in {1..20}; do
            after="$(printf '%s\n' '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"look","arguments":{"app":"Calculator"}}}' | "$daemon" mcp)"
            if printf '%s' "$after" | jq -e --arg object "$display_object" '[.result.structuredContent.app.windows[].root | .. | objects | select(.identifier? == $object and .value? == "01")] | length == 1' >/dev/null; then
              verified=true
              break
            fi
            sleep 0.1
          done
          test "$verified" = true
          echo 'Linux MCP facade captured, resolved, invoked, and verified GNOME Calculator through the daemon'

      # The rung that must NOT light up here. This runner is a GNOME Wayland session: the
      # compositor refuses synthetic input, and X11 cannot see or restore the foreground even with
      # XWayland running alongside. A delivery here would be a failure rather than a bonus, so
      # proving the refusal is honest on the real Wayland stack is worth as much as proving
      # delivery works on X11. `keyboard` is the probe because it needs no resolved target and
      # rides the same global-input ladder `click` does.
      - name: Refuse global input honestly under Wayland
        working-directory: rust
        run: |
          set -euo pipefail
          daemon=target/debug/axon-linux
          "$daemon" serve >/tmp/axon-linux-wayland.log 2>&1 &
          daemon_pid=$!
          # Bounded on purpose. A daemon that never bound the socket cannot be shut down, and an
          # unbounded `wait` here would block on the live process forever -- turning any failure
          # above into a job timeout that hides which assertion actually failed.
          cleanup() {
            "$daemon" shutdown >/dev/null 2>&1 || true
            for _ in {1..40}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then return 0; fi
              sleep 0.25
            done
            kill -9 "$daemon_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # The daemon binds its socket after AT-SPI comes up, so the first request has to wait for
          # it; without that wait the connect fails with ENOENT and the refusal below is never
          # exercised. Waiting on this daemon's own pid is also what ties the refusal to this build
          # rather than to whatever else might be holding the socket.
          ../scripts/assert-daemon-under-test "$daemon" "$daemon_pid" /tmp/axon-linux-wayland.log

          for policy in backgroundOnly foregroundPermitted; do
            refused="$(jq -cn --arg policy "$policy" '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"keyboard","arguments":{"text":"x","deliveryPolicy":$policy}}}' | "$daemon" mcp)"
            # A refusal is an action result, not a transport error: the request was well formed and
            # the daemon declined.
            printf '%s' "$refused" | jq -e '.result.isError == false' >/dev/null
            printf '%s' "$refused" | jq -e '.result.structuredContent.dispatchSuccess == false' >/dev/null
            printf '%s' "$refused" | jq -e '.result.structuredContent.delivery == null' >/dev/null
            # noDeliveryCandidate rather than foregroundNotPermitted: opting in cannot conjure a
            # device, so the caller must not be sent after a permission that changes nothing.
            printf '%s' "$refused" | jq -e '.result.structuredContent.refusal.reason == "noDeliveryCandidate"' >/dev/null
            printf '%s' "$refused" | jq -e '.result.structuredContent.refusal.message | test("Wayland")' >/dev/null
          done
          echo 'Linux under Wayland withheld the foreground rung at both policies'

      # The lifecycle and the published status document, exercised against a real logged-in GNOME
      # session. The desktop's own registration was parked at the top of the job, so `daemon
      # install` registers this build and nothing else, and the restore step below unregisters it
      # even when an assertion here fails.
      - name: Install, report status, shut down, and uninstall
        working-directory: rust
        run: |
          set -euo pipefail
          unit="$HOME/.config/systemd/user/axon.service"
          daemon="$PWD/target/debug/axon-linux"

          expected_version="$(cat ../VERSION)"
          test "$("$daemon" version)" = "$expected_version"

          "$daemon" daemon install
          test "$(systemctl --user is-enabled axon.service)" = enabled

          # Read together on purpose: an `on-failure` restart landing between the two would fail
          # the pid assertion below over a restart rather than over the thing being tested.
          status="$("$daemon" status --json)"
          main_pid="$(systemctl --user show -p MainPID --value axon.service)"
          printf '%s' "$status" | jq -e '.schemaVersion == "health-v1"' >/dev/null
          printf '%s' "$status" | jq -e --arg v "$expected_version" '.version == $v' >/dev/null
          printf '%s' "$status" | jq -e '.platform == "linux"' >/dev/null
          printf '%s' "$status" | jq -e '.daemon.running and .daemon.ready' >/dev/null
          printf '%s' "$status" | jq -e '.session.interactive and .session.graphical' >/dev/null
          printf '%s' "$status" | jq -e --arg p "$daemon" '.registration.registered and .registration.path == $p' >/dev/null
          # For the same reason the probes above check the pid they spawned: the registration is
          # read from the unit file, while everything else in this document comes from whichever
          # daemon answered. Requiring that to be the service just installed is what keeps the two
          # halves describing the same process.
          printf '%s' "$status" | jq -e --argjson pid "$main_pid" '.daemon.processId == $pid' >/dev/null
          # The complete vocabulary, every unusable entry explained.
          printf '%s' "$status" | jq -e '.capabilities | length == 15' >/dev/null
          printf '%s' "$status" | jq -e '[.capabilities[] | select(.usable == false and (.reason // "") == "")] | length == 0' >/dev/null
          # Wayland withdraws synthetic input; the document must say so rather than promise it.
          printf '%s' "$status" | jq -e '[.capabilities[] | select(.capability == "pointerInput")][0] | .usable == false and .reason == "wayland-restricted"' >/dev/null

          "$daemon" daemon restart
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"look","arguments":{}}}' \
            | "$daemon" mcp | jq -e '.result.isError == false' >/dev/null

          "$daemon" shutdown
          # Shutdown leaves the registration in place; only the daemon stops.
          "$daemon" status --json | jq -e '.daemon.running == false and .registration.registered == true' >/dev/null
          # Describing a stopped daemon is a success, not a failure.
          "$daemon" status --json >/dev/null

          "$daemon" daemon uninstall
          test ! -e "$unit"
          "$daemon" status --json | jq -e '.registration.registered == false and .registration.reason == "not-registered"' >/dev/null
          echo 'Linux systemd-user lifecycle installed, reported health-v1, restarted, shut down, and uninstalled'

      # The counterpart to the parking step, and the reason any step above may leave the machine
      # in whatever state it fails in. `always()` because a failed probe is exactly when the
      # desktop most needs its own daemon back.
      - name: Restore the installed Axon registration
        if: always()
        run: |
          set -euo pipefail
          # Set only by the parking step, and the reason this step may remove a registration at
          # all: without it the job never touched the desktop's own, and the unit sitting there is
          # that registration rather than a probe's leftover.
          if [ -z "${AXON_UNIT:-}" ]; then
            echo 'the registration was never parked; leaving the desktop alone'
            exit 0
          fi
          unit="$AXON_UNIT"
          daemon="$GITHUB_WORKSPACE/rust/target/debug/axon-linux"
          # Any registration or daemon still here belongs to the probes, because the desktop's own
          # were parked and stopped. Both have to go before the parked unit is put back, or the
          # restored service starts into a socket that is already taken. Best-effort: an end state
          # already reached looks the same as a command that had nothing to do.
          "$daemon" daemon uninstall >/dev/null 2>&1 || true
          "$daemon" shutdown >/dev/null 2>&1 || true
          rm -f "$unit"
          systemctl --user daemon-reload >/dev/null 2>&1 || true

          if [ -z "${AXON_PARKED:-}" ]; then
            echo 'no parked registration to restore'
            exit 0
          fi
          mkdir -p "$(dirname "$unit")"
          cp -p "$AXON_PARKED" "$unit"
          rm -f "$AXON_PARKED"
          systemctl --user daemon-reload
          # Not tolerated the way the parking side is: a restore that quietly does not happen
          # leaves the desktop without the daemon it had, and nobody finds out until the next run.
          if [ "${AXON_WAS_ENABLED:-false}" = true ] && ! systemctl --user enable axon.service; then
            echo '::error::the desktop Axon registration was restored but could not be re-enabled'
            exit 1
          fi
          echo 'restored the parked registration'

          if [ "${AXON_WAS_ACTIVE:-false}" != true ]; then
            exit 0
          fi
          if ! systemctl --user start axon.service; then
            echo '::error::the desktop Axon daemon was restored but did not start again'
            exit 1
          fi
          # `systemctl start` succeeding is not the daemon working, and this unit says so itself:
          # Type=simple means systemd calls it started at exec, which is before Axon can bind, so a
          # zero exit here covers a daemon that exec'd and died on a socket a probe never released.
          # Trusting it would be the same silent failure this job exists to close, one step further
          # out. Both halves are required: systemd's view alone is the exec claim above, and an
          # answer alone could come from a probe's orphan that bound while the socket was being
          # swept -- which is the case that leaves the restored unit dead on AddrInUse.
          answering=false
          for _ in {1..40}; do
            status="$("$daemon" status --json)"
            main_pid="$(systemctl --user show -p MainPID --value axon.service)"
            if [ "$(systemctl --user is-active axon.service || true)" = active ] \
              && printf '%s' "$status" | jq -e '.daemon.running' >/dev/null; then
              answering=true
              break
            fi
            sleep 0.25
          done
          if [[ "$answering" != true ]]; then
            # Both halves reported, because the two failures look nothing alike to whoever reads
            # this next: a unit that never came up, or a unit that is down while something else
            # answers on its endpoint.
            echo "::error::the desktop axon.service did not come back at $(printf '%s' "$status" | jq -r '.daemon.endpoint') -- unit is $(systemctl --user is-active axon.service || true), a daemon answering: $(printf '%s' "$status" | jq -r '.daemon.running'); this runner needs attention before the next live run"
            journalctl --user -u axon.service -n 20 --no-pager || true
            exit 1
          fi
          # Exact whenever the document allows it. A daemon this build can parse names its own
          # process, so requiring that to be systemd's is what rules out an orphan answering in the
          # restored service's place. `ready` and a mandatory pid are deliberately not required:
          # the desktop runs whichever release it installed, and a payload this build is too new to
          # parse reports a daemon that is up with no process id at all, where the pair above is
          # the most that can honestly be asserted.
          if printf '%s' "$status" | jq -e '.daemon.processId != null' >/dev/null \
            && ! printf '%s' "$status" | jq -e --argjson pid "$main_pid" '.daemon.processId == $pid' >/dev/null; then
            echo "::error::$(printf '%s' "$status" | jq -r '.daemon.endpoint') is answered by pid $(printf '%s' "$status" | jq -r '.daemon.processId'), not the restored axon.service (pid $main_pid)"
            journalctl --user -u axon.service -n 20 --no-pager || true
            exit 1
          fi
          echo 'the desktop Axon daemon is answering again'

  windows:
    name: Windows live loop
    runs-on: [self-hosted, axon-live-windows]
    concurrency:
      group: axon-live-windows
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Remove leaked live-probe daemons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceRoot = 'C:\actions-runner-axon\_work\'
          $liveRoot = 'C:\ProgramData\Axon\live\'

          function Get-LiveProbeDaemons {
            @(Get-CimInstance Win32_Process -Filter "Name = 'axon-win.exe'" |
              Where-Object {
                $path = $_.ExecutablePath
                $null -ne $path -and (
                  $path.StartsWith($workspaceRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                  $path.StartsWith($liveRoot, [System.StringComparison]::OrdinalIgnoreCase)
                )
              })
          }

          foreach ($attempt in 1..3) {
            foreach ($process in Get-LiveProbeDaemons) {
              Write-Output "Stopping leaked live-probe daemon pid=$($process.ProcessId) path=$($process.ExecutablePath)"
              try { Stop-Process -Id $process.ProcessId -Force -ErrorAction Stop }
              catch { Write-Warning "Could not stop pid=$($process.ProcessId) on attempt ${attempt}: $_" }
            }
            if ((Get-LiveProbeDaemons).Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          }
          $remaining = Get-LiveProbeDaemons
          if ($remaining.Count -ne 0) {
            throw "Scoped live-probe daemons remain: $($remaining.ExecutablePath -join ', ')"
          }

      - name: Check out Axon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restart the interactive daemon and inspect a real window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ssh = 'C:\Program Files\Git\usr\bin\ssh.exe'
          $arguments = @(
            '-F', 'C:\actions-runner-axon\.ssh\empty_config',
            '-i', 'C:\actions-runner-axon\.ssh\axon-live-probe',
            '-o', 'BatchMode=yes',
            '-o', 'IdentitiesOnly=yes',
            '-o', 'ConnectTimeout=5',
            '-o', 'StrictHostKeyChecking=yes',
            '-o', 'UserKnownHostsFile=C:\actions-runner-axon\.ssh\known_hosts',
            'mitch@localhost',
            'probe'
          )
          & $ssh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "interactive probe failed with exit code $LASTEXITCODE"
          }
