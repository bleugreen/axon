# A release is one product version built natively on three platforms and published together.
#
# The tag is the release identity and must agree with the checked-in VERSION file; a tag that
# disagrees is rejected rather than quietly producing artifacts named after something else.
# Publishing is a separate job that runs only after all three native builds succeed, so a release
# can never exist with two of its three targets missing.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release. Leave unchecked for a dry run.
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify the release version
        id: resolve
        run: |
          set -euo pipefail
          VERSION="$(./scripts/check-version)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="$GITHUB_REF_NAME"
            # The tag names the release, so a tag that disagrees with VERSION is a mistake to
            # surface rather than a value to prefer.
            ./scripts/check-version --tag "$TAG"
            PUBLISH=true
          else
            TAG="v$VERSION"
            PUBLISH="${{ inputs.publish }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS
    needs: version
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Check release secrets
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required}"

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/axon-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/axon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "AXON_NOTARY_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        env:
          AXON_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          AXON_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ./scripts/package-app
          # One bundle to verify: --deep and the stapled ticket both cover the nested editor.
          codesign --verify --deep --strict "dist/Axon.app"
          spctl -a -vvv -t install "dist/Axon.app"
          xcrun stapler validate "dist/Axon.app"

      - name: Verify the packaged CLI and nested editor report the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGED="dist/Axon.app/Contents/Resources/bin/axon"
          ACTUAL="$("$PACKAGED" version)"
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "::error::packaged CLI reports $ACTUAL, expected $VERSION"
            exit 1
          fi
          # A skewed pair is the failure nesting exists to prevent; assert it rather than trust it.
          EDITOR_PLIST="dist/Axon.app/Contents/Library/Applications/Axon Editor.app/Contents/Info.plist"
          EDITOR_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EDITOR_PLIST")"
          if [[ "$EDITOR_VERSION" != "$VERSION" ]]; then
            echo "::error::nested editor reports $EDITOR_VERSION, expected $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Axon-${{ needs.version.outputs.version }}-macos-aarch64.zip
            dist/Axon-${{ needs.version.outputs.version }}-macos-aarch64.zip.sha256
          if-no-files-found: error

  # Windows binaries are Authenticode-signed with Azure Artifact Signing. Signing is what gives the
  # daemon a stable publisher identity, and without one Defender treats every build as a file it has
  # never seen: block-at-first-sight held a fresh unsigned axon-win.exe for ~47 s before its first
  # instruction ran, and ML behavioral heuristics quarantined one outright for doing exactly what an
  # automation daemon does (register a scheduled task, relaunch into the interactive session, serve a
  # pipe). Signing is applied between staging and archiving so the archive a consumer downloads and
  # the checksum that vouches for it both describe the signed bytes.
  windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    # The signing identity is a GitHub OIDC federated credential scoped to this environment name.
    # Changing it, or removing it, revokes the job's ability to sign.
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Stage axon-win
        run: ./scripts/package-rust axon-win --stage-only

      - name: Check signing configuration
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID is required for Windows release signing}"
          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID is required for Windows release signing}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID is required for Windows release signing}"
          : "${AZURE_SIGNING_ENDPOINT:?AZURE_SIGNING_ENDPOINT is required for Windows release signing}"
          : "${AZURE_SIGNING_ACCOUNT:?AZURE_SIGNING_ACCOUNT is required for Windows release signing}"
          : "${AZURE_SIGNING_PROFILE:?AZURE_SIGNING_PROFILE is required for Windows release signing}"

      # No client secret is stored: the workflow presents a GitHub OIDC token and Azure exchanges it
      # for the signer role on the certificate profile.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\axon-win-${{ needs.version.outputs.version }}-windows-x86_64\*.exe
          file-digest: SHA256
          # Artifact Signing certificates are short-lived by design, so a signature is only valid
          # beyond a few days if it is timestamped.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Axon
          description-url: https://github.com/bleugreen/axon
          # The `Azure login` step above is the only credential this job has, so every other source
          # DefaultAzureCredential would try is a guaranteed miss that only delays the real failure.
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Verify the packaged CLI reports the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL="$(dist/axon-win-$VERSION-windows-x86_64/axon-win.exe version)"
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "::error::packaged axon-win reports $ACTUAL, expected $VERSION"
            exit 1
          fi

      - name: Archive axon-win
        run: ./scripts/package-rust axon-win --archive-only

      # Verified from inside the archive rather than from the staging directory, because the archive
      # is what a consumer downloads and Windows is what evaluates the signature on it.
      - name: Verify the archived binaries carry trusted signatures
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "axon-win-$env:VERSION-windows-x86_64"
          $extracted = Join-Path $env:RUNNER_TEMP 'signature-check'
          Remove-Item -Recurse -Force $extracted -ErrorAction Ignore
          Expand-Archive -Path "dist/$name.zip" -DestinationPath $extracted

          foreach ($binary in @('axon-win.exe', 'axon-win-daemon.exe')) {
            $path = Join-Path $extracted "$name\$binary"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Host "::error::archive is missing $binary"
              exit 1
            }
            $signature = Get-AuthenticodeSignature -FilePath $path
            Write-Host "$binary status:    $($signature.Status)"
            Write-Host "$binary signer:    $($signature.SignerCertificate.Subject)"
            Write-Host "$binary timestamp: $($signature.TimeStamperCertificate.Subject)"

            if ($signature.Status -ne 'Valid') {
              Write-Host "::error::archived $binary is not validly signed: $($signature.Status) - $($signature.StatusMessage)"
              exit 1
            }
            # An untimestamped signature expires with the certificate, which for this service is days.
            if ($null -eq $signature.TimeStamperCertificate) {
              Write-Host "::error::archived $binary is signed but not timestamped"
              exit 1
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/axon-win-${{ needs.version.outputs.version }}-windows-x86_64.zip
            dist/axon-win-${{ needs.version.outputs.version }}-windows-x86_64.zip.sha256
          if-no-files-found: error

  linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install AT-SPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libpipewire-0.3-dev libclang-dev clang pkg-config

      - name: Package axon-linux
        run: ./scripts/package-rust axon-linux

      - name: Verify the packaged daemon reports the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL="$(dist/axon-linux-$VERSION-linux-x86_64/axon-linux version)"
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "::error::packaged axon-linux reports $ACTUAL, expected $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/axon-linux-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            dist/axon-linux-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify every target is present with a checksum
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          MISSING=0
          for NAME in \
            "Axon-$VERSION-macos-aarch64.zip" \
            "axon-win-$VERSION-windows-x86_64.zip" \
            "axon-linux-$VERSION-linux-x86_64.tar.gz"; do
            if [[ ! -f "release/$NAME" || ! -f "release/$NAME.sha256" ]]; then
              echo "::error::missing artifact or checksum for $NAME"
              MISSING=1
            fi
          done
          [[ "$MISSING" == "0" ]]
          cd release
          # Re-verify rather than trust the producing job: the checksum a consumer will use has to
          # match the bytes that actually reach the release.
          sha256sum -c ./*.sha256

      - name: Publish GitHub release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Axon $VERSION" \
              --generate-notes
          fi

      - name: Publish Homebrew cask
        if: needs.version.outputs.publish == 'true' && env.PUBLIC_RELEASE_PAT != ''
        env:
          PUBLIC_RELEASE_PAT: ${{ secrets.PUBLIC_RELEASE_PAT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          SHA256="$(awk '{ print $1 }' "release/Axon-$VERSION-macos-aarch64.zip.sha256")"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"

          git clone "https://x-access-token:${PUBLIC_RELEASE_PAT}@github.com/bleugreen/homebrew-tap.git" "$TAP_DIR"
          cd "$TAP_DIR"
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p Casks
          cat > Casks/axon.rb <<CASK
          cask "axon" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/bleugreen/axon/releases/download/v#{version}/Axon-#{version}-macos-aarch64.zip"
            name "Axon"
            desc "Local macOS accessibility service for agents"
            homepage "https://github.com/bleugreen/axon"

            depends_on macos: ">= :sonoma"

            app "Axon.app"
            binary "#{appdir}/Axon.app/Contents/Resources/bin/axon"

            zap trash: [
              "~/Library/Application Support/Axon",
              "~/Library/Logs/Axon",
            ]
          end
          CASK

          git add Casks/axon.rb
          git commit -m "Update axon cask to $VERSION" || exit 0
          git push origin main
